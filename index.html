<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaurav – Health Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Clinical notebook: calm teal accent, a severity stripe on every row, summary first then detail */
  --bg:#f5f7f7; --panel:#ffffff; --ink:#1b2a2e; --muted:#5d6f73; --line:#dde5e6;
  --accent:#0f6e74; --accent-soft:#e2f0f0;
  --low:#1f5fae; --low-soft:#e4edfa; --high:#b3261e; --high-soft:#fbe9e7;
  --ok:#2e7d4f; --ok-soft:#e6f3eb; --note:#8a6100; --note-soft:#fbf0d4;
  --display:"Fraunces", Georgia, serif; --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111819; --panel:#182224; --ink:#e3ecec; --muted:#9aaeb0; --line:#2a383a;
    --accent:#5cc0c4; --accent-soft:#16393b;
    --low:#7fb0ec; --low-soft:#18273d; --high:#f08a80; --high-soft:#3d2120;
    --ok:#7ccf9c; --ok-soft:#1b3326; --note:#e0b44a; --note-soft:#3a2f12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111819; --panel:#182224; --ink:#e3ecec; --muted:#9aaeb0; --line:#2a383a;
  --accent:#5cc0c4; --accent-soft:#16393b;
  --low:#7fb0ec; --low-soft:#18273d; --high:#f08a80; --high-soft:#3d2120;
  --ok:#7ccf9c; --ok-soft:#1b3326; --note:#e0b44a; --note-soft:#3a2f12; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:24px 20px 60px;display:grid;gap:20px}
header{display:grid;gap:6px}
h1{font-family:var(--display);font-weight:600;font-size:30px;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.sub{color:var(--muted);margin:0}
.save{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:2px}
.tile b{font-size:26px;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.wt small{font-size:12.5px;font-weight:700;color:var(--ink,#1d2b3a)}
.wt b{font-size:22px}
.wt{align-content:start}
.wt:hover{border-color:#1f5fae}
.tile li b{font-size:inherit;color:var(--ink,#1d2b3a)}
.attn{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--high);border-radius:10px;padding:14px 18px}
.attn ul{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
nav{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
nav a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
nav a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.list{display:grid;gap:10px}
.q{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.q.open{border-left-color:var(--low)} .q.asked{border-left-color:var(--note)} .q.answered{border-left-color:var(--ok)}
.q .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.pri{background:var(--high-soft);color:var(--high)}
.q .ques{font-weight:600;font-size:16px}
.q .why{color:var(--muted);margin:0}
.q .why b{color:var(--ink);font-weight:600}
.status{display:flex;gap:6px;flex-wrap:wrap}
.status button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.status button[aria-pressed="true"].s-open{background:var(--low-soft);border-color:var(--low);color:var(--low)}
.status button[aria-pressed="true"].s-asked{background:var(--note-soft);border-color:var(--note);color:var(--note)}
.status button[aria-pressed="true"].s-answered{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
textarea,input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:60px;resize:vertical}
label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--panel);border:0;border-radius:6px;padding:9px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg);white-space:nowrap}
tbody tr.grp td{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
td.name b{display:block}
td.name small{color:var(--muted);display:block;max-width:44ch}
td.v{white-space:nowrap;font-weight:600}
td.v.l{background:var(--low-soft);color:var(--low)}
td.v.h{background:var(--high-soft);color:var(--high)}
td.v.x{background:var(--note-soft);color:var(--note)}
td.v.n{color:var(--ok)}
td.v .fl{font-size:11px;font-weight:700;margin-left:4px}
td.rng{color:var(--muted);font-size:13px;min-width:120px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tl{display:grid;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.tl div{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tl div:last-child{border-bottom:0}
.tl time{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.tl p{margin:0}
.tl p.d{color:var(--muted);font-size:14px}
.hide{display:none}
.note{font-size:13px;color:var(--muted);margin:0}
@media (max-width:520px){.tl div{grid-template-columns:1fr;gap:2px}h1{font-size:25px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
:root{--zl:#c9daf3;--zn:#cbe7d5;--zh:#f2c6c1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--zl:#1d3047;--zn:#1f3d2a;--zh:#4a2522}}
:root[data-theme="dark"]{--zl:#1d3047;--zn:#1f3d2a;--zh:#4a2522}
.wrap{max-width:1280px}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.rt{text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--ok);border-radius:8px;padding:10px 11px;cursor:pointer;display:grid;gap:4px;align-content:start;min-height:156px;transition:transform .15s,box-shadow .15s}
.rt:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,30,40,.08)}
.rt.l{border-top-color:var(--low)}.rt.h{border-top-color:var(--high)}.rt.x{border-top-color:var(--note)}
.rt[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.rt .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.sym{font-family:var(--display);font-size:28px;font-weight:600;line-height:1}
.rt .grp{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:right;line-height:1.2}
.tn{font-size:13px;color:var(--muted);line-height:1.25;min-height:2.5em}
.vv{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}.vv.l{color:var(--low)}.vv.h{color:var(--high)}.vv.x{color:var(--note)}.vv.n{color:var(--ok)}
.vv small{font-weight:400;color:var(--muted);font-size:11px}
.spec{position:relative;height:10px;display:flex;margin-top:4px}
.spec span{height:100%}
.spec .zl{background:var(--zl);border-radius:5px 0 0 5px}.spec .zn{background:var(--zn)}.spec .zh{background:var(--zh);border-radius:0 5px 5px 0}
.spec .none{background:var(--line);border-radius:5px;flex:1}
.mk{position:absolute;top:-3px;width:4px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.mk.old{opacity:.35;width:3px;height:12px;top:-1px}
.speclab{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.big .spec{height:14px}.big .mk{height:22px;top:-4px}.big .mk.old{height:16px;top:-1px}
.mlab{position:absolute;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:var(--muted)}
.ordt{font-size:12px;font-weight:600;margin-top:2px}.ordt.y{color:var(--ok)}.ordt.n{color:var(--muted)}
td.ord{text-align:center;white-space:nowrap}
td.ord .yes{color:var(--ok);font-weight:700;font-size:18px}
td.ord .no{color:var(--high);font-weight:700;font-size:18px;opacity:.7}
td.ord small{display:block;color:var(--muted);font-size:11px;white-space:normal;max-width:16ch;margin:0 auto}
.side{position:sticky;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-height:calc(100vh - 24px);overflow:auto}
.side h2{margin:0}
.ph{display:flex;gap:12px;align-items:center}
.psym{font-family:var(--display);font-size:30px;font-weight:600;min-width:62px;height:62px;padding:0 8px;display:grid;place-items:center;border-radius:10px;background:var(--ok-soft);color:var(--ok)}
.psym.l{background:var(--low-soft);color:var(--low)}.psym.h{background:var(--high-soft);color:var(--high)}.psym.x{background:var(--note-soft);color:var(--note)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;margin-top:4px;background:var(--ok-soft);color:var(--ok)}
.pill.l{background:var(--low-soft);color:var(--low)}.pill.h{background:var(--high-soft);color:var(--high)}.pill.x{background:var(--note-soft);color:var(--note)}
.hist{display:grid;gap:2px;margin:8px 0 6px}
.hist div{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px dashed var(--line);padding:3px 0;font-variant-numeric:tabular-nums}
.ordline{margin:10px 0;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:600}
.ordline.y{background:var(--ok-soft);color:var(--ok)}.ordline.n{color:var(--muted);border:1px dashed var(--line)}
.blk{margin-top:12px}.blk h3{color:var(--accent);margin-bottom:4px}.blk p,.blk ul{margin:0}.blk ul{padding-left:18px;display:grid;gap:3px}
.x-close{display:none;float:right}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sc{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.sc.stop{border-left-color:var(--high);background:var(--high-soft)}.sc.change{border-left-color:var(--low)}.sc.add{border-left-color:var(--accent)}.sc.later{border-left-color:var(--note)}
.sc h3{font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0}
.sc .dose{font-size:13px;color:var(--muted)}
.sc .when{font-size:13px}
.sb{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;justify-self:start}
.sb.stop{background:var(--high);color:#fff}.sb.change{background:var(--low-soft);color:var(--low)}.sb.add{background:var(--accent-soft);color:var(--accent)}.sb.later{background:var(--note-soft);color:var(--note)}.sb.keep{background:var(--ok-soft);color:var(--ok)}
.sc.research{border-left-color:#8a96a3;border-left-style:dashed;background:#f7f8fa}
.sb.research{background:#eceff3;color:#3f4a57;border:1px dashed #8a96a3}.sb.hold{background:#fff1d6;color:#8a5a00;border:1px dashed #c27c0e}.sb.planned{background:#e6f0fb;color:#24558f;border:1px dashed #5b87bf}
.rt3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rt3 .card ul,.dcard ul{margin:0;padding-left:18px;display:grid;gap:4px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.dcard h3{font-size:15px;color:var(--accent);margin:0}
.ptab{width:100%;border-collapse:collapse;font-size:14px}.ptab td{padding:5px 6px;border-bottom:1px dashed var(--line)}.ptab td:last-child{text-align:right;font-weight:600;white-space:nowrap}
td.qcol{min-width:240px;max-width:320px}
.qc{font-size:13px;line-height:1.35;padding-left:8px;border-left:3px solid var(--low);margin-bottom:8px}
.qc.asked{border-left-color:var(--note)}.qc.answered{border-left-color:var(--ok)}
.qc b{font-weight:600;display:block}.qc small{color:var(--muted)}
.stg{cursor:pointer}
.stg:hover{filter:brightness(.95)}
.cday{display:block;font-size:11px;font-weight:500;line-height:1.3;color:#5b3a99;margin-top:4px;white-space:normal;width:120px}
.hm td{width:20px;height:20px;padding:0;border:1px solid #fff}
.hm th{font-size:11px;font-weight:600;color:#5b6672;padding:2px 4px;text-align:right;white-space:nowrap}
.hm td.pd{box-shadow:inset 0 0 0 2px #d6336c}
.gl{color:inherit;text-decoration:underline dotted 2px;text-underline-offset:3px;cursor:pointer;border-radius:3px}
.gl:hover,.gl:focus{background:var(--note-soft,#fff3d6);outline:none}
#gloss{max-width:560px;width:calc(100% - 32px);border:1px solid var(--line,#ddd);border-radius:14px;padding:22px 24px;box-shadow:0 18px 50px rgba(0,0,0,.25);font-size:15px;line-height:1.5}
#cycpop{max-width:980px;width:calc(100% - 32px);border:1px solid var(--line,#ddd);border-radius:14px;padding:22px 24px;box-shadow:0 18px 50px rgba(0,0,0,.25);font-size:14px;line-height:1.45}
#cycpop::backdrop{background:rgba(0,0,0,.35)}
#cycpop .gx{position:absolute;top:10px;right:12px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted,#666)}
.cyq{width:34px;height:30px;border:2px solid;border-radius:7px;background:#fff;font-weight:700;font-size:13px;cursor:pointer}
.cyq:hover{filter:brightness(.95)}
.cyq{position:relative}
.cyq:hover::after,.cyq:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1d2b3a;color:#fff;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:5;pointer-events:none}
.cyleg{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:#1d2b3a}
.cyleg i{display:inline-block;width:22px;height:12px;margin-right:6px;vertical-align:middle}
#gloss::backdrop{background:rgba(0,0,0,.35)}
.fbar{display:flex;flex-wrap:wrap;gap:6px}
.fgoal{font-size:15px;margin:4px 0 8px}
.fnotes summary{cursor:pointer;font-weight:600;color:var(--accent,#0f6e74)}
.fnotes ul{margin:8px 0 0;padding-left:18px;display:grid;gap:8px;font-size:14px;line-height:1.5}
.fgo{display:inline-block;background:#eef6f6;color:#0f6e74;border:1px solid #cfe5e3;border-radius:999px;padding:2px 9px;font-size:12px;margin:0 4px 4px 0;font-weight:600}
.flater{background:#fbefd0!important;color:#9a6a12!important;border-color:#ecd9a6!important}
.fopt{background:#fbf6ea;border-left:4px solid #c27c0e;padding:8px 10px;border-radius:6px;font-size:14px}
.fsess h3{margin:14px 0 6px;font-size:16px}.fsess h3 small{font-weight:400;color:var(--muted,#5b6672)}
.fexl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.exl{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel,#fff);border:1px solid var(--line,#d9dee5);border-radius:10px;padding:6px 10px;cursor:pointer;font:inherit;color:inherit}
.exl:hover,.ftile:hover{border-color:#0f6e74;box-shadow:0 2px 8px rgba(15,110,116,.15)}
.exl b{display:block;font-size:13.5px;line-height:1.3}.exl small{display:block;color:var(--muted,#5b6672);font-size:12.5px}
.fth{flex:0 0 74px;width:74px;display:block}.fth0{font-size:30px;text-align:center;color:#c27c0e}
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ftile{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel,#fff);border:1px solid var(--line,#d9dee5);border-radius:10px;padding:8px;cursor:pointer;font:inherit;color:inherit;font-size:13px;text-align:center}
.ftile .fth{width:120px;flex-basis:auto}
.ftile .flater{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid}
.fgh{margin:14px 0 6px;font-size:15px}
.fweek{border-collapse:collapse;width:100%;font-size:13.5px}.fweek th,.fweek td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line,#e3e6ea);vertical-align:top}.fweek tr.fsel td{background:#eef6f6}
.linkb{background:none;border:0;padding:0;color:#0f6e74;font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
#gloss.wide{max-width:860px}.fver{display:block;font-size:11.5px;color:var(--muted,#5b6672);line-height:1.3}.fver i{font-style:normal;font-weight:700;color:#0f6e74}.fvtab tr.fcur th,.fvtab tr.fcur td{background:#eef6f6}.fvtab th small{font-weight:400;color:#0f6e74}.fmeter{margin:8px 0 10px;font-size:14px}.fmbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:6px}.fmbar span{border-radius:8px;padding:6px 8px;font-size:13px;line-height:1.3}.fmbar small{font-size:12px}.fmg{background:#d8efe0;color:#245c3a}.fmy{background:#fbefc4;color:#6e5200;outline:3px solid #c9a000}.fmr{background:#f6d6d3;color:#8e2a20}
.ffr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ffr figure{margin:0;border:1px solid var(--line,#e3e6ea);border-radius:10px;padding:6px;background:#fbfcfd}
.ffr figcaption{font-size:13px;line-height:1.4;padding:4px 2px}
.ftab{border-collapse:collapse;width:100%;font-size:14px}.ftab th{text-align:left;width:30%;padding:6px 8px;vertical-align:top;background:#f5f7f9;border-bottom:1px solid #e3e6ea}.ftab td{padding:6px 8px;border-bottom:1px solid #e3e6ea;vertical-align:top}
.fbadges{margin:0 0 6px}
.fphases{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.fphase{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel,#fff);border:2px solid var(--line,#d9dee5);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}.fphase[aria-pressed=true]{border-color:#0f6e74;background:#eef6f6}.fphase b{font-size:15px}.fphase small{color:#0f6e74;font-weight:600}.fphase span{font-size:13px;color:var(--muted,#5b6672)}.fsum{cursor:pointer;font-weight:700;font-size:15px}
.frest{font-size:13.5px;background:#f5f7f9;border-radius:8px;padding:6px 10px;margin:0 0 8px}
.ftests{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:14px}.ftests label{display:flex!important;gap:8px;align-items:flex-start;justify-content:flex-start!important;text-align:left;cursor:pointer;width:auto}.ftests input{margin-top:3px;width:auto!important;flex:0 0 auto}.ftests label span,.ftests label{flex-wrap:nowrap}

#gloss h2{margin:0 0 10px;font-size:20px}
#gloss h3{margin:16px 0 6px;font-size:15px}
#gloss ul{margin:0;padding-left:20px;display:grid;gap:6px}
#gloss ul ul{margin-top:4px;gap:2px}
#gloss .gx{position:absolute;top:10px;right:12px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted,#666)}
.qchk{list-style:none;padding:0;margin:6px 0 4px;display:grid;gap:3px;font-size:14px}
.qchk li::before{content:"☐ ";font-size:15px}
.qc .qchk{font-size:13px}
.cidx{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}
.cidx div{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.cidx b{color:var(--ink);min-width:86px}
.cidx span{display:inline-flex;align-items:center;gap:6px}
.cidx i{display:inline-block;width:22px;height:16px;border-radius:3px}
.cidx i.bar-i{height:9px;border-radius:5px}
.cidx i.dot{width:12px;height:12px;border-radius:50%}
.cidx i.ring{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);background:transparent}
.cidx i.mk-i{width:4px;height:15px;border-radius:2px;background:var(--ink)}
.rt.n{background:var(--ok-soft)}.rt.l{background:var(--low-soft)}.rt.h{background:var(--high-soft)}.rt.x{background:var(--note-soft)}
.gsec{display:grid;gap:8px;margin-bottom:20px}
.gh{font-size:13px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:5px;margin:0}
.tnm{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.2;min-height:2.4em}
.tlink{font:inherit;font-weight:700;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-align:left;text-decoration:underline dotted;text-underline-offset:3px}
@media (max-width:1100px){.lay{grid-template-columns:minmax(0,1fr) 330px}}
@media (max-width:760px){#cside{position:static!important;display:block!important;max-height:none!important;box-shadow:none!important;border-radius:10px!important}#cside .x-close{display:none!important}}
@media (max-width:760px){.lay{grid-template-columns:1fr}.side{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:72vh;border-radius:14px 14px 0 0;z-index:30;box-shadow:0 -8px 30px rgba(0,0,0,.2);display:none}.side.open{display:block}.x-close{display:inline-block}}

<script>
const SRC = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
let S = JSON.parse(document.getElementById("state").textContent);
let qFilter = "all", qDoc = "all", onlyFlag = false, ART = null, timer = null;
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FL = {l:"LOW", h:"HIGH", x:"CHECK", n:""};

function today(){ const d=new Date(); return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }

function setSave(msg){ $("save").textContent = msg; }
function save(){
  clearTimeout(timer);
  if(!ART){ setSave("Changes are shown here but can't be saved in this view."); return; }
  setSave("Saving…");
  timer = setTimeout(async () => {
    const json = JSON.stringify(S).replace(/</g,"\\u003c");
    const html = SRC.replace(/(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/, (m,a,b) => a + json + b);
    try { await ART.publish(html); setSave("Saved."); }
    catch(e){ setSave("Couldn't save (" + (e && (e.code||e.message) || "error") + "). Your change shows here but wasn't kept."); }
  }, 1200);
}

function header(){
  $("h-title").textContent = S.title;
  $("h-sub").textContent = S.subtitle;
  const open = S.questions.filter(q=>q.status==="open").length;
  const asked = S.questions.filter(q=>q.status==="asked").length;
  const ans = S.questions.filter(q=>q.status==="answered").length;
  let flagged = 0; S.tests.forEach(t=>{ const last=t.values[t.values.length-1]; if(last && last.f!=="n") flagged++; });
  $("tiles").innerHTML = [
    [open,"questions still to ask"],[asked,"asked, waiting for an answer"],[ans,"answered"],[flagged,"results out of range at last test"]
  ].map(([n,l])=>`<div class="tile"><b>${n}</b><span>${l}</span></div>`).join("");
  $("attn").innerHTML = `<h2>What needs attention</h2><ul>${S.attention.map(a=>`<li>${a}</li>`).join("")}</ul>`;
}

function questions(){
  const docs = [...new Set(S.questions.map(q=>q.doctor))];
  const list = S.questions.filter(q => !QMAP[q.id] && (qFilter==="all"||q.status===qFilter) && (qDoc==="all"||q.doctor===qDoc)).sort((a,b)=>docs.indexOf(a.doctor)-docs.indexOf(b.doctor));
  const fb = (v,l) => `<button class="chip" data-qf="${v}" aria-pressed="${qFilter===v}">${l}</button>`;
  const db = (v,l) => `<button class="chip" data-qd="${esc(v)}" aria-pressed="${qDoc===v}">${esc(l)}</button>`;
  $("v-questions").innerHTML = `
  <div style="display:grid;gap:14px">
    <p class="note" style="font-size:14px">Questions about a specific test result are in the Test results tab, next to that test. The ones here are not tied to one result.</p>
    <div class="bar">${fb("all","All")}${fb("open","To ask")}${fb("asked","Asked")}${fb("answered","Answered")}</div>
    <div class="bar">${db("all","Every doctor")}${docs.map(d=>db(d,d)).join("")}</div>
    <div class="list">${list.map(q=>`
      <article class="q ${q.status}" data-id="${q.id}">
        <div class="top"><span class="tag">${esc(q.doctor)}</span>${q.date?`<span class="note">Asked ${esc(q.date)}</span>`:''}</div>
        <div class="ques">${esc(q.q)}</div>${q.list?`<ul class="qchk">${q.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
        <p class="why"><b>Why:</b> ${esc(q.why)}</p>
        <div class="status">
          <button class="s-open" data-s="open" aria-pressed="${q.status==="open"}">To ask</button>
          <button class="s-asked" data-s="asked" aria-pressed="${q.status==="asked"}">Asked</button>
          <button class="s-answered" data-s="answered" aria-pressed="${q.status==="answered"}">Answered</button>
        </div>
      </article>`).join("") || '<p class="note">No questions match these filters.</p>'}
    </div>
    <form class="card" id="addq">
      <h2>Add a question</h2>
      <div class="form">
        <label for="nq-q" style="grid-column:1/-1">Question<input id="nq-q" required></label>
        <label for="nq-why" style="grid-column:1/-1">Why it matters (one line)<input id="nq-why" required></label>
        <label for="nq-doc">Doctor<input id="nq-doc" list="docs" value="${esc(docs[0]||"")}" required></label>
        <datalist id="docs">${docs.map(d=>`<option value="${esc(d)}">`).join("")}</datalist>
        <button class="btn" type="submit">Add question</button>
      </div>
    </form>
  </div>`;
}

const CNOTE = {};
function results(){
  const dates = S.dates;
  let rows = "", grp = null;
  const GO = GROUPS.map(x=>x[0]), gi = g => { const k = GO.indexOf(g); return k<0 ? 999 : k; };
  const ALL = S.tests.concat(EXTRA_ORD.map(([n,w,g])=>({name:n, unit:"", explain:w, range:"", group:g, values:[], extra:true})));
  ALL.sort((a,b)=>gi(a.group)-gi(b.group));
  ALL.forEach((t,i) => {
    const last = t.values[t.values.length-1];
    if(onlyFlag && !t.values.some(v=>v.f!=="n")) return;
    if(rGroup!=="all" && t.group!==rGroup) return;
    if(t.group!==grp){ grp=t.group; rows += `<tr class="grp"><td colspan="${dates.length+5}">${esc(grp)}</td></tr>`; }
    const cells = dates.map(d => { const v=t.values.find(x=>x.d===d); const cn=(CNOTE[t.name]||{})[d]; return v?`<td class="v ${v.f}">${esc(v.v)}${FL[v.f]?`<span class="fl">${FL[v.f]}</span>`:''}${cn?`<small class="cday">${esc(cn)}</small>`:''}</td>`:'<td class="v" style="color:var(--muted)">–</td>'; }).join("");
    const w = worst(t);
    rows += `<tr><td class="tcell ${w}"><button class="tbtn" data-open="${esc(t.name)}" ${t.extra?'disabled':''}><span class="tnm2">${esc(t.name)}</span>${t.unit?`<span class="tun">${esc(t.unit)}</span>`:''}</button><small>${esc(t.explain)}</small></td><td class="rng">${esc(t.range)}</td><td class="barc">${t.values.length ? `<div class="big">${spec(t,true,true)}</div>` : '<span class="note">Not done yet</span>'}</td>${cells}<td class="ord">${(t.extra||ORD[t.name])?`<span class="yes" aria-label="Ordered">✓</span><small>${esc(ORD[t.name]||"")}</small>`:'<span class="no" aria-label="Not ordered">✗</span>'}</td>${qcell(t.name)}</tr>`;
  });
  $("v-results").innerHTML = `
  <div style="display:grid;gap:14px">
    <div class="bar">
      <button class="chip" id="flagtoggle" aria-pressed="${onlyFlag}">Only show tests that were ever out of range</button>
    </div>
    <div class="legend"><span><i style="background:var(--low-soft);border:1px solid var(--low)"></i>Low</span><span><i style="background:var(--high-soft);border:1px solid var(--high)"></i>High</span><span><i style="background:var(--note-soft);border:1px solid var(--note)"></i>Can't be read as is</span><span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>In range</span><span><i style="background:var(--zl);width:22px;height:8px;border-radius:4px"></i>Low zone</span><span><i style="background:var(--zn);width:22px;height:8px;border-radius:4px"></i>Normal zone</span><span><i style="background:var(--zh);width:22px;height:8px;border-radius:4px"></i>High zone</span><span><i style="background:var(--ink);width:4px;height:14px;border-radius:2px"></i>Latest result</span><span><i style="background:var(--ink);opacity:.35;width:4px;height:14px;border-radius:2px"></i>Earlier results</span><span>Click a test name for the full explanation.</span></div>
    <style>
     #v-results td.tcell{min-width:190px;border-left:4px solid var(--ok);background:var(--ok-soft)}
     #v-results td.tcell.l{border-left-color:var(--low);background:var(--low-soft)}#v-results td.tcell.h{border-left-color:var(--high);background:var(--high-soft)}#v-results td.tcell.x{border-left-color:var(--note);background:var(--note-soft)}
     #v-results .tbtn{font:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--ink);display:block}
     #v-results .tbtn:disabled{cursor:default}
     #v-results .tbtn:not(:disabled):hover .tnm2{text-decoration:underline;text-underline-offset:4px}
     #v-results .tnm2{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.15;display:block}
     #v-results .tun{font-size:12px;color:var(--muted)}
     #v-results td.tcell small{display:block;color:var(--muted);font-size:12px;margin-top:4px;max-width:30ch}
     #v-results td.barc{min-width:240px;padding-top:16px}
     #v-results .side{position:fixed;top:12px;right:12px;bottom:12px;left:auto;width:min(440px,94vw);max-height:none;z-index:40;box-shadow:0 10px 40px rgba(0,0,0,.25);display:none;border-radius:12px}
     #v-results .side.open{display:block}
     #v-results .x-close{display:inline-block}
    </style>
    <div class="tablewrap"><table>
      <thead><tr><th>Test</th><th>Normal range</th><th>Results on the range</th>${dates.map(d=>`<th>${esc(d)}</th>`).join("")}<th>Labs ordered now</th><th>Questions to ask</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div><aside class="side" id="tside" aria-live="polite"></aside>
    <form class="card" id="addr">
      <h2>Add a new result</h2>
      <p class="note">Pick an existing test, or type a new name. New dates become a new column.</p>
      <div class="form">
        <label for="nr-test">Test<input id="nr-test" list="tests" required></label>
        <datalist id="tests">${S.tests.map(t=>`<option value="${esc(t.name)}">`).join("")}</datalist>
        <label for="nr-date">Date (e.g. Jan 2027)<input id="nr-date" required></label>
        <label for="nr-val">Result<input id="nr-val" required></label>
        <label for="nr-flag">Compared with range<select id="nr-flag"><option value="n">In range</option><option value="l">Low</option><option value="h">High</option><option value="x">Can't be read as is</option></select></label>
        <label for="nr-range">Normal range (new tests)<input id="nr-range"></label>
        <button class="btn" type="submit">Add result</button>
      </div>
    </form>
  </div>`;
}

function history(){
  $("v-history").innerHTML = `
  <div style="display:grid;gap:14px">
    <div class="tl">${S.history.map(h=>`<div><time>${esc(h.d)}</time><span><p><b>${esc(h.t)}</b></p><p class="d">${esc(h.x)}</p></span></div>`).join("")}</div>
    ${S.pending.length?`<div class="card"><h2>Ordered, not done yet</h2><ul style="margin:0;padding-left:20px;display:grid;gap:4px">${S.pending.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:''}
    <form class="card" id="addh">
      <h2>Add to history</h2>
      <div class="form">
        <label for="nh-d">Date<input id="nh-d" required></label>
        <label for="nh-t">What happened<input id="nh-t" required></label>
        <label for="nh-x" style="grid-column:1/-1">Details<input id="nh-x"></label>
        <button class="btn" type="submit">Add</button>
      </div>
    </form>
  </div>`;
}

function netClass(n){ return /^in network/i.test(n)?"ok":/not in|out of/i.test(n)?"high":"low"; }
function careRank(p){ const r = p.role||""; if(/Primary care/i.test(r)) return 0; if(/Fertility specialist · #1|Fertility specialist · #1/.test(r)) return 1; if(/OB\/GYN|Gynecology/.test(r)){ const m = r.match(/#(\d)/); return m ? 10 + (+m[1]) : 20; } if(/Fertility/.test(r)) return 30; return 40; }

function show(){
  const V = ["glance","results","questions","care","map","whoop","supps"];
  const v = (location.hash||"#glance").slice(1);
  const view = V.includes(v)?v:"glance";
  V.forEach(n => $("v-"+n).classList.toggle("hide", n!==view));
  document.querySelectorAll("nav a").forEach(a => a.setAttribute("aria-current", a.dataset.v===view?"page":"false"));
}

g" aria-pressed="false">Show all finding names</button><button class="chip" id="motog" aria-pressed="false">Pause motion</button><button class="chip" id="zin">+ Zoom in</button><button class="chip" id="zout">− Zoom out</button><button class="chip" id="zreset">Reset view</button></div><div id="netbox"></div></div>`;
}
function drawNet(){
  const box = document.getElementById('netbox'); if(!box || !window.d3 || !S.graph) return;
  if(window.__sim) window.__sim.stop(); if(window.__raf) cancelAnimationFrame(window.__raf);
  box.innerHTML = '';
  const g = S.graph, F = g.findings;
  const pal = ['#0f6e74','#b4540a','#5b5fa8','#b3261e','#2e7d4f','#8a4fa3','#c27c0e','#2b6cb0','#a23b72','#4d7c0f','#6b5b4b','#0e7490'];
  const deg = {}; F.forEach(f=>f.links.forEach(id=>deg[id]=(deg[id]||0)+1));
  const C = g.conditions.filter(c=>deg[c.id]);
  const maxd = Math.max(1, ...C.map(c=>deg[c.id]));
  const nodes = [], links = [], cmap = {};
  const wrapL = s => { const L = []; let cur = ''; s.split(' ').forEach(x=>{ if((cur+' '+x).trim().length>20 && cur){ L.push(cur); cur = x; } else cur = (cur+' '+x).trim(); }); if(cur) L.push(cur); return L; };
  C.forEach((c,j)=>{ const n = {id:'c_'+c.id, t:'k', cid:c.id, label:c.label, col:pal[j%pal.length], d:deg[c.id], r:16+24*Math.sqrt(deg[c.id]/maxd)}; n.lines = wrapL(`${c.label} · ${deg[c.id]}`); n.lw = Math.max(...n.lines.map(x=>x.length)); nodes.push(n); cmap[c.id] = n; });
  F.forEach((f,i)=>{ const ls = f.links.filter(id=>cmap[id]); nodes.push({id:'f'+i, t:'f', i, label:f.label, flag:f.flag, n:ls.length});
    ls.forEach(id=>links.push({source:'f'+i, target:'c_'+id, kind:'x', cid:id, fi:i, w:cmap[id].d, spec:ls.length})); });
  const pair = {};
  F.forEach(f=>{ const ls = f.links.filter(id=>cmap[id]); for(let a=0;a<ls.length;a++) for(let b=a+1;b<ls.length;b++){ const k=[ls[a],ls[b]].sort().join('|'); pair[k]=(pair[k]||0)+1; } });
  Object.entries(pair).forEach(([k,v])=>{ const [a,b]=k.split('|'); links.push({source:'c_'+a, target:'c_'+b, kind:'s', w:v}); });
  const maxs = Math.max(1, ...links.filter(l=>l.kind==='s').map(l=>l.w));
  if(!g.probes) g.probes = [];
  PROBES.forEach(p=>{ if(!g.probes.some(x=>x.id===p.id)) g.probes.push(Object.assign({status:'open'}, p)); });
  const OP = g.probes.filter(p=>p.status==='open' && p.links.some(id=>cmap[id]));
  OP.forEach(p=>{ nodes.push({id:'p_'+p.id, t:'p', pid:p.id, label:p.label, kind:p.kind}); p.links.filter(id=>cmap[id]).forEach(id=>links.push({source:'p_'+p.id, target:'c_'+id, kind:'p', w:1})); });
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id)
      .distance(l=>l.kind==='s' ? 420-160*l.w/maxs : l.kind==='p' ? 170 : 240-80*l.w/maxd)
      .strength(l=>l.kind==='s' ? 0.04+0.2*l.w/maxs : l.kind==='p' ? 0.12 : 0.12+0.5*l.w/maxd))
    .force('charge', d3.forceManyBody().strength(d=>d.t==='k' ? -3600 : -380).distanceMax(900))
    .force('collide', d3.forceCollide(d=>d.t==='k' ? Math.max(d.r+70, d.lw*8.5) : 24).iterations(4))
    .force('x', d3.forceX(0).strength(0.025)).force('y', d3.forceY(0).strength(0.035)).stop();
  for(let k=0;k<600;k++) sim.tick();
  const xs = nodes.map(n=>n.x), ys = nodes.map(n=>n.y), pad = 210;
  const x0 = Math.min(...xs)-pad, y0 = Math.min(...ys)-pad, W = Math.max(...xs)-Math.min(...xs)+2*pad, H = Math.max(...ys)-Math.min(...ys)+2*pad;
  nodes.forEach((n,k)=>{ n.bx = n.x; n.by = n.y; n.ph = k*1.7; });
  const svg = d3.select(box).append('svg').attr('viewBox', `${x0.toFixed(0)} ${y0.toFixed(0)} ${W.toFixed(0)} ${H.toFixed(0)}`).attr('width','100%')

  fl0.append('feGaussianBlur').attr('stdDeviation',5).attr('result','b');
  const mg = fl0.append('feMerge'); mg.append('feMergeNode').attr('in','b'); mg.append('feMergeNode').attr('in','SourceGraphic');
  const halo = s => s.style('paint-order','stroke').style('stroke','var(--panel)').style('stroke-width','5px').style('stroke-linejoin','round').style('pointer-events','none');
  svg.append('rect').attr('x',x0).attr('y',y0).attr('width',W).attr('height',H).style('fill','transparent');
  const root = svg.append('g');
  const SL = links.filter(l=>l.kind==='s'), XL = links.filter(l=>l.kind==='x'), PL = links.filter(l=>l.kind==='p');
  const synOp = l => 0.10+0.45*l.w/maxs, lkOp = l => l.spec<=2 ? 0.6+0.35*l.w/maxd : 0.5;
  const syn = root.append('g').selectAll('line').data(SL).join('line').style('stroke','var(--note)').style('stroke-linecap','round')
    .style('stroke-width', l=>1+6*l.w/maxs).style('opacity', synOp).style('stroke-dasharray','2 6');
  const pl = root.append('g').selectAll('line').data(PL).join('line').style('stroke','#7a838b').style('stroke-width',1.8).style('stroke-dasharray','10 8').style('opacity',0.7);
  const lk = root.append('g').selectAll('line').data(XL).join('line').attr('class','lk').attr('data-f', l=>l.fi).attr('data-c', l=>l.cid)

  XL.forEach((l,k)=>{ l.ph = (k*0.137)%1; l.sp = 0.05+0.22*l.w/maxd; });

  const pn = root.append('g').selectAll('g').data(nodes.filter(n=>n.t==='p')).join('g').attr('class','pnd').style('cursor','pointer');
  pn.append('circle').attr('r',17).style('fill','#dfe3e7').style('stroke','#3a4148').style('stroke-width',2.5);
  pn.append('text').text(d=>d.kind==='test'?'T':'?').attr('text-anchor','middle').attr('dy','0.35em').attr('font-size',21).attr('font-weight',800).style('fill','#1f2428').style('pointer-events','none');
  const plab = pn.append('text').text(d=>d.label).attr('text-anchor','middle').attr('dy',-14).attr('font-size',18).style('fill','#3f474e').call(halo).style('opacity',0);
  pn.on('mouseenter', function(){ d3.select(this).select('text:last-of-type').style('opacity',1); })

    .on('click', (e,d)=>probePanel(d.pid, cmap));
  const nd = root.append('g').selectAll('g').data(nodes.filter(n=>n.t!=='p')).join('g').attr('class','nd')
    .attr('data-f', d=>d.t==='f'?d.i:null).attr('data-c', d=>d.t==='k'?d.cid:null).style('cursor','pointer');
  const ring = nd.filter(d=>d.t==='k').append('circle').attr('r', d=>d.r).style('fill','none').style('stroke', d=>d.col).style('stroke-width',2).style('pointer-events','none');
  nd.append('circle').attr('r', d=>d.t==='k' ? d.r : 4+1.6*d.n)
    .style('fill', d=>d.t==='k' ? d.col : `var(--${d.flag||'low'})`).style('fill-opacity', d=>d.t==='k' ? 0.22 : 1)
    .style('stroke', d=>d.t==='k' ? d.col : 'var(--panel)').style('stroke-width', d=>d.t==='k' ? 2.5 : 1.5)
    .attr('filter', d=>d.t==='k' && d.d >= 0.5*maxd ? 'url(#nglow)' : null);
  nd.filter(d=>d.t==='k').append('text').attr('text-anchor','middle').attr('y', d=>d.r+28).each(function(d){ const tx = d3.select(this); d.lines.forEach((ln,i)=>tx.append('tspan').attr('x',0).attr('dy', i ? '1.1em' : 0).text(ln)); })
    .attr('font-size',27).attr('font-weight',700).style('fill', d=>d.col).call(halo);
  let showAll = false, sel = null, zk = 1;
  const flab = nd.filter(d=>d.t==='f').append('text').text(d=>d.label).attr('text-anchor','middle').attr('dy',-12)
    .attr('font-size',20).style('fill','var(--ink)').call(halo).style('opacity',0);
  const touches = (l,d) => l.source.id===d.id || l.target.id===d.id;
  function focus(d){
    if(!d){ nd.style('opacity',1); lk.style('opacity', lkOp); syn.style('opacity', synOp); parts.style('opacity',1); flab.style('opacity', (showAll||zk>2)?1:0); plab.style('opacity', (showAll||zk>2)?1:0); pn.style('opacity',1); pl.style('opacity',0.7); return; }
    const on = new Set([d.id]); XL.forEach(l=>{ if(touches(l,d)){ on.add(l.source.id); on.add(l.target.id); } });
    nd.style('opacity', n=>on.has(n.id)?1:0.1);
    lk.style('opacity', l=>touches(l,d)?0.95:0.03); parts.style('opacity', l=>touches(l,d)?1:0);
    syn.style('opacity', l=>touches(l,d)?0.8:0.03); flab.style('opacity', n=>on.has(n.id)?1:0);
    pl.style('opacity', l=>touches(l,d)?0.9:0.04); pn.style('opacity', n=>PL.some(l=>touches(l,d)&&l.source.id===n.id)?1:0.1); plab.style('opacity', n=>PL.some(l=>touches(l,d)&&l.source.id===n.id)?1:0);
  }

const PROBES = [];

   <div class="blk"><h3>A yes strengthens</h3><ul>${cs.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>
   <div class="bar"><button class="btn" data-pq="${p.id}" data-pa="yes">${T?'Done, abnormal':'Yes'}</button>${T?'':`<button class="btn ghost" data-pq="${p.id}" data-pa="sometimes">Sometimes</button><button class="btn ghost" data-pq="${p.id}" data-pa="rarely">Rarely</button>`}<button class="btn ghost" data-pq="${p.id}" data-pa="no">${T?'Done, normal':'No'}</button><button class="chip" data-pq="${p.id}" data-pa="open">${T?'Not done yet':'Not sure'}</button></div>`;

document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('[data-pq]'); if(!b) return;
  const p = (S.graph.probes||[]).find(x=>x.id===b.dataset.pq); if(!p) return;
  p.status = b.dataset.pa;
  S.graph.findings = S.graph.findings.filter(f=>f.probe!==p.id);
  if(p.status==='yes') S.graph.findings.push({label: p.label + (p.kind==='test' ? ' (abnormal)' : ''), flag:'note', links:p.links.slice(), probe:p.id});
  if(p.status==='sometimes' || p.status==='rarely') S.graph.findings.push({label: p.label + ' (' + p.status + ')', flag:'note', links:p.links.slice(), probe:p.id});
  save(); drawNet();
  const side = document.getElementById('cside');
  if(side) side.innerHTML = `<button class="chip x-close" data-close="cside">Close</button><h2>${esc(p.label)}</h2><p>${p.status==='yes'?'Added to your map. The links it points to are now stronger.':p.status==='sometimes'?'Added to your map as "sometimes".':p.status==='rarely'?'Added to your map as "rarely".':p.status==='no'?'Noted as no. It is off the map.':'Left open. It stays on the map as a grey dot.'}</p>`;
