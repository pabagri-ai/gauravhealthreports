    tile(`${L.hrv} ms`,'Heart rate variability (HRV)', arrow(L.hrv,F.hrv,true)),
    tile(`${L.rec}%`,'Recovery score', arrow(L.rec,F.rec,true)),
    tile(hm(L.sleep),'Asleep per night', `WHOOP's estimated need: ${hm(L.need)}`),
    tile(`${L.perf}%`,'Sleep performance', arrow(L.perf,F.perf,true)),
    tile(`${L.wk} a week`,'Workouts', arrow(L.wk,F.wk,null)),
    tile(`${L.spo2}%`,'Blood oxygen during sleep',''),
    tile(`${L.rr} a min`,'Breathing rate during sleep','')
  ].join('');
  const chart = (key, label, unit, fmt) => {
    const pts = M.map((m,i)=>({i, v:m[key], m:m.m, p:m.partial})).filter(p=>p.v!=null && !isNaN(p.v));
    const vs = pts.map(p=>p.v), mn = Math.min(...vs), mx = Math.max(...vs), pad = (mx-mn)*0.15 || 1;
    const lo = mn-pad, hi = mx+pad, W = 520, H = 150, x0 = 40, x1 = W-10, y0 = 14, y1 = H-28;
    const X = i => x0 + (x1-x0)*i/(M.length-1), Y = v => y1 - (y1-y0)*(v-lo)/(hi-lo);
    const line = pts.filter(p=>!p.p).map(p=>`${X(p.i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
    const f = fmt || (v=>Math.round(v));
    const ticks = [0, Math.floor((M.length-1)/2), M.length-1].map((i,k)=>`<text x="${X(i)}" y="${H-8}" text-anchor="${k===0?'start':k===2?'end':'middle'}" font-size="11" fill="var(--muted)">${M[i].m}</text>`).join('');
    const yt = [lo+pad, hi-pad].map(v=>`<text x="${x0-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${f(v)}</text><line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/>`).join('');
    const dots = pts.map(p=>`<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${p.p?4:3}" fill="${p.p?'var(--panel)':'var(--accent)'}" stroke="var(--accent)" stroke-width="1.5"><title>${p.m}${p.p?' (partial month)':''}: ${f(p.v)} ${unit}</title></circle>`).join('');
    const last = pts.filter(p=>!p.p).slice(-1)[0];
    return `<div class="card" style="gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h3 style="margin:0">${label}</h3><span class="note">${last.m}: <b>${f(last.v)} ${unit}</b></span></div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label} by month">${yt}<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}${ticks}</svg></div>`;
  };
  const charts = [
    chart('rhr','Resting heart rate','bpm'),

  const top = WH.maxhr.map(r=>`<tr><td>${esc(r.d)}</td><td>${esc(r.a)}</td><td>${r.min} min</td><td><b>${r.max}</b></td><td>${r.avg}</td></tr>`).join('');
  el.innerHTML = `<div style="display:grid;gap:14px">
    <p class="note" style="font-size:14px">From Gaurav's WHOOP band, ${esc(WH.range[0])} to ${esc(WH.range[1])} (${WH.days} days). The boxes show the last 30 days (from ${esc(WH.lastFrom)}); the arrows compare with his first three months (Mar–May 2025). WHOOP numbers are estimates from a wrist sensor, not medical tests.</p>

document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.qf){ qFilter=t.dataset.qf; questions(); return; }
  if(t.dataset.qd){ qDoc=t.dataset.qd; questions(); return; }
  if(t.id==="flagtoggle"){ onlyFlag=!onlyFlag; results(); return; }
  if(t.dataset.net){
    const [kind,i,net] = t.dataset.net.split(":");
    const p = S[kind][+i]; p.network = net; p.checked = net==="Not checked" ? "" : today() + " (by you)";
    care(); save(); return;
  }
  if(t.dataset.s){
    const q = S.questions.find(x=>x.id===t.closest(".q").dataset.id);
    q.status = t.dataset.s;
    if(q.status!=="open" && !q.date) q.date = today();
    if(q.status==="open") q.date = "";
    header(); questions(); save();
  }
});
document.addEventListener("change", (e) => {
  const id = e.target.dataset && e.target.dataset.ans; if(!id) return;
  const q = S.questions.find(x=>x.id===id); q.answer = e.target.value;
  if(q.answer && q.status==="open"){ q.status="answered"; q.date = q.date || today(); header(); questions(); }
  save();
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target.id;
  if(f==="addq"){
    S.questions.push({id:"q"+Date.now(), doctor:$("nq-doc").value.trim(), q:$("nq-q").value.trim(), why:$("nq-why").value.trim(), status:"open", answer:"", date:""});
    questions(); header();
  } else if(f==="addr"){
    const name=$("nr-test").value.trim(), d=$("nr-date").value.trim();
    let t = S.tests.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!t){ t={name, unit:"", explain:"Added by you.", range:$("nr-range").value.trim(), group:"Added results", values:[]}; S.tests.push(t); }
    if(!S.dates.includes(d)) S.dates.push(d);
    t.values = t.values.filter(v=>v.d!==d); t.values.push({d, v:$("nr-val").value.trim(), f:$("nr-flag").value});
    t.values.sort((a,b)=>S.dates.indexOf(a.d)-S.dates.indexOf(b.d));
    results(); header();
  } else if(f==="addc"){
    const net=$("nc-net").value;
    S[$("nc-kind").value].push({name:$("nc-name").value.trim(), role:$("nc-role").value.trim(), place:$("nc-place").value.trim(), phone:$("nc-phone").value.trim(), network:net, checked: net==="Not checked"?"":today()+" (by you)"});
    care();
  } else if(f==="addh"){
    S.history.push({d:$("nh-d").value.trim(), t:$("nh-t").value.trim(), x:$("nh-x").value.trim()});
    history();
  } else return;
  save();
});

let GS_SUB = "sched";
const GS_STAT = {taking:["Taking","#1e6b38","#e3f4e8"],consider:["Consider","#1f5fae","#dde8f8"],researched:["Researched","#5b3a99","#ece6f7"],skip:["Skip","#a32020","#fbe1e1"],check:["Check","#8a6100","#fdf0d2"]};
const GS_SLOTS = [
  ["Breakfast","Morning · breakfast","#c27c0e","#fdf3e1","☀"],
  ["Dinner","Evening · dinner","#7a4fb3","#efe9f8","◒"],
  ["Bedtime","Bedtime","#25324a","#e7eaf0","☾"]
];
/* rows: [slot, product index, how label, how note, avoid list [[label, note]], together label] */
function gsIdx(name){ return GSP.products.findIndex(p => p.name.startsWith(name)); }
const GS_ROWS = [
  ["Breakfast", "Omega-3 fish oil", "With food + fat", "Absorbed up to 3 times better with a meal that has fat (Lawson 1988). Can go with breakfast or dinner, whichever meal has more fat.", [], "consider"],
  ["Breakfast", "L-carnitine", "With food", "Trials split the daily amount across meals. Half with breakfast, half with dinner.", [], "consider"],
  ["Dinner", "Kirkland Signature CoQ10", "With food + fat", "CoQ10 dissolves in fat, so a meal with some oil, nuts or seeds helps it absorb.", [["Blood thinners or insulin","CoQ10 may interact with warfarin and insulin (NCCIH). Tell a doctor before starting either."]], "taking"],
  ["Dinner", "L-carnitine", "With food", "Second half of the daily amount, with dinner.", [], "consider"],
  ["Bedtime", "Magnesium glycinate", "Food not needed", "Works with or without food. Glycinate is gentle on the stomach.", [["Some antibiotics and bone drugs (2 h)","Magnesium can block tetracycline and quinolone antibiotics and bone drugs (bisphosphonates). Keep them at least 2 hours apart."]], "taking"]
];
function gsEsc(t){ return String(t ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function gsPop(title, html){
  let d = document.getElementById("gspop");
  if(!d){ d = document.createElement("dialog"); d.id = "gspop"; document.body.appendChild(d);
    d.addEventListener("click", e => { if(e.target === d || e.target.closest(".gsx")) d.close(); }); }
  d.innerHTML = `<button class="gsx" aria-label="Close">×</button><h2>${title}</h2>${html}`;
  d.showModal();
}
function gsProductPop(i){
  const p = GSP.products[i]; if(!p) return;
  const st = GS_STAT[p.status] || GS_STAT.check;
  const trials = (p.trials||[]).length ? `<h3>Trials</h3><div style="overflow-x:auto"><table class="gst"><thead><tr><th>Study</th><th>Who</th><th>Dose</th><th>How long</th><th>Result</th></tr></thead><tbody>${p.trials.map(t=>`<tr><td>${t.link?`<a href="${gsEsc(t.link)}" target="_blank" rel="noopener">${gsEsc(t.cite)}</a>`:gsEsc(t.cite)}<br><small>${gsEsc(t.design||"")}${t.n?" · "+gsEsc(t.n):""}${t.verified===false?" · not verified":""}</small></td><td>${gsEsc(t.who)}</td><td>${gsEsc(t.dose)}${t.brand&&!/not stated|varied/i.test(t.brand)?`<br><small>Brand: ${gsEsc(t.brand)}</small>`:""}</td><td>${gsEsc(t.duration)}</td><td>${gsEsc(t.result)}</td></tr>`).join("")}</tbody></table></div>` : "";
  const rk = p.ranked || p.ranked_products || [];
  const ranked = rk.length ? `<h3>Best products</h3><ol>${rk.map(r=>`<li><b>${gsEsc(r.product)}</b>${r.price?` · ${gsEsc(r.price)}`:""}${r.certification?` · <small>${gsEsc(r.certification)}</small>`:""}</li>`).join("")}</ol>` : "";
  gsPop(gsEsc(p.name), `<p><span class="gstag" style="background:${st[2]};color:${st[1]}">${st[0]}</span> <small style="color:#6b7480">${gsEsc(p.category||"")}</small></p>
    <p><b>Dose:</b> ${gsEsc(p.dose)}<br><b>When:</b> ${gsEsc(p.when)}<br><b>How:</b> ${gsEsc(p.how)}<br><b>Safety and what to keep apart:</b> ${gsEsc(p.avoid||"Nothing found")}</p>
    <p>${gsEsc(p.why)}</p>${trials}${ranked}`);
}
function gSupps(){
  const el = document.getElementById("v-supps"); if(!el) return;
  const css = `<style>
   #v-supps .gs{display:grid;gap:16px;max-width:1120px}
   .gs-tabs{display:inline-flex;gap:4px;padding:4px;background:#e6e8eb;border-radius:999px;width:max-content;max-width:100%;flex-wrap:wrap}
   .gs-tabs button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;padding:8px 16px;border-radius:999px;cursor:pointer;opacity:.75}
   .gs-tabs button.on{background:#fff;opacity:1;box-shadow:0 1px 3px rgba(0,0,0,.12)}
   .gs-slot{background:#fff;border:1px solid #e3e6ea;border-radius:14px;overflow:hidden}
   .gs-slot h3{margin:0;padding:10px 16px;font-size:15px;display:flex;gap:8px;align-items:center}
   .gs-row,.gs-hd{display:grid;grid-template-columns:minmax(170px,1.1fr) minmax(120px,.7fr) 1.2fr 1fr;gap:10px;padding:10px 16px;align-items:center}
   .gs-row{border-top:1px solid #eef0f2}
   .gs-hd{padding:0 16px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6b7480}
   .gs-row .nm{font:inherit;font-weight:700;font-size:14.5px;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:#1d2630}
   .gstag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
   .gs-chip{font:inherit;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid;cursor:pointer;margin:2px 4px 2px 0}
   .gs-none{font-size:12.5px;color:#8a929b}
   .gs-cat{background:#fff;border:1px solid #e3e6ea;border-radius:14px;overflow:hidden}
   .gs-cat summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between}
   .gs-cat summary::-webkit-details-marker{display:none}
   .gs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:12px 16px 16px}
   .gs-card{font:inherit;text-align:left;cursor:pointer;background:#fafbfc;border:1px solid #e3e6ea;border-left:4px solid;border-radius:10px;padding:10px 12px;display:grid;gap:4px;color:#1d2630}
   .gs-card b{font-size:14px}.gs-card small{color:#6b7480;font-size:12.5px;line-height:1.35}
   .gs-ing{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
   .gs-ing div{background:#fff;border:1px solid #e3e6ea;border-top:4px solid;border-radius:12px;padding:12px 14px}
   .gs-ing b{display:block;font-size:15px}.gs-ing .v{font-size:20px;font-weight:800;margin:4px 0}.gs-ing small{display:block;color:#5b6570;font-size:12.5px;line-height:1.4}
   #gspop{max-width:860px;width:94vw;border:0;border-radius:14px;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
   #gspop .gsx{position:sticky;top:0;float:right;border:0;background:#eef0f2;border-radius:50%;width:30px;height:30px;font-size:18px;cursor:pointer}
   #gspop h2{margin:0 0 8px;font-size:19px}#gspop h3{font-size:15px;margin:14px 0 6px}
   table.gst{border-collapse:collapse;width:100%;font-size:12.5px;min-width:640px}
   table.gst th{background:#1d2b3a;color:#fff;text-align:left;padding:6px}
   table.gst td{border-top:1px solid #e6e9ee;padding:6px;vertical-align:top}
   @media (max-width:640px){.gs-row,.gs-hd{grid-template-columns:1fr}.gs-hd{display:none}}
  </style>`;
  const tabs = `<div class="gs-tabs">${[["sched","My schedule"],["all","All products"],["ing","Ingredients"]].map(([k,l])=>`<button data-gsub="${k}" class="${GS_SUB===k?'on':''}">${l}</button>`).join("")}</div>`;
  const chip = (lab, key, bg, fg, bd) => `<button class="gs-chip" data-gsnote="${gsEsc(key)}" style="background:${bg};color:${fg};border-color:${bd}">${gsEsc(lab)}</button>`;
  window.GS_NOTES = {};
  let nk = 0;
  const slots = GS_SLOTS.map(([k,label,fg,bg,ic]) => {
    const rows = GS_ROWS.filter(r => r[0] === k).map(([_, nm, how, hown, avoid, st]) => {
      const i = gsIdx(nm); if(i < 0) return "";
      const p = GSP.products[i], s = GS_STAT[p.status] || GS_STAT.check;
      const hk = "n" + (nk++); GS_NOTES[hk] = [how, hown];
      const av = avoid.length ? avoid.map(([l, n]) => { const ak = "n" + (nk++); GS_NOTES[ak] = [l, n]; return chip("✕ " + l, ak, "#fdecea", "#a8322a", "#f2b8b2"); }).join("") : '<span class="gs-none">Nothing special</span>';
      const mates = GS_ROWS.filter(r => r[0] === k && r[1] !== nm);
      const tk = "n" + (nk++); GS_NOTES[tk] = ["Fine together", mates.length ? `These can be taken at the same meal: ${mates.map(m => m[1]).join(", ")}. None block each other.` : "Taken on its own at this time."];
      const tog = chip(mates.length ? "✓ Rest of this group" : "✓ Alone", tk, "#e6f0fb", "#1f5fae", "#a9c6ea");
      return `<div class="gs-row"><div><button class="nm" data-gsp="${i}">${gsEsc(nm)}</button><span class="gstag" style="background:${s[2]};color:${s[1]}">${s[0]}</span></div><div>${chip(how, hk, "#e3f4ea", "#1e6b38", "#9fd3b1")}</div><div>${av}</div><div>${tog}</div></div>`;
    }).join("");
    return `<div class="gs-slot"><h3 style="background:${bg};color:${fg}"><span>${ic}</span>${label}</h3>${rows}</div>`;
  }).join("");
  const sched = `<div data-gspane="sched" style="display:${GS_SUB==='sched'?'grid':'none'};gap:14px">
    <p class="note" style="margin:0">"Taking" items are what he takes now. "Consider" items have the best men's fertility evidence and are shown where they would go if he starts them. Sperm take about 74 days to form, so any change needs about 3 months before a semen test shows it. Tap a name for the trials, a chip for the reason.</p>
    <div class="gs-hd"><span>Supplement</span><span>How</span><span>Avoid</span><span>Together?</span></div>${slots}</div>`;
  const order = ["taking","consider","researched","skip"];
  const cats = order.map(s => {
    const items = GSP.products.map((p,i)=>[p,i]).filter(([p]) => p.status === s);
    if(!items.length) return "";
    const st = GS_STAT[s];
    return `<details class="gs-cat" open><summary>${st[0]} <span style="font-size:12px;color:#6b7480;background:#f1f3f5;border-radius:999px;padding:2px 9px">${items.length}</span></summary><div class="gs-grid">${items.map(([p,i])=>`<button class="gs-card" data-gsp="${i}" style="border-left-color:${st[1]}"><b>${gsEsc(p.name)}</b><small>${gsEsc(p.category||"")} · ${gsEsc(p.dose||"")}</small></button>`).join("")}</div></details>`;
  }).join("");
  const all = `<div data-gspane="all" style="display:${GS_SUB==='all'?'grid':'none'};gap:12px"><p class="note" style="margin:0">Every product researched for him, grouped by decision. Tap a card for the dose, timing, trial-by-trial results and the best-tested products.</p>${cats}</div>`;
  const ing = `<div data-gspane="ing" style="display:${GS_SUB==='ing'?'grid':'none'};gap:12px"><p class="note" style="margin:0">His daily totals now, and what changes if the "consider" products are added. Supplement magnesium tops out at 350 mg a day.</p><div class="gs-ing">${GSP.ingredients.map(n=>{const st=GS_STAT[n.status]||GS_STAT.check; return `<div style="border-top-color:${st[1]}"><b>${gsEsc(n.nutrient)}</b><span class="gstag" style="background:${st[2]};color:${st[1]};margin:4px 0 0">${st[0]}</span><div class="v">${gsEsc(n.total_per_day)}</div><small><b>Need:</b> ${gsEsc(n.need)}</small><small><b>Max:</b> ${gsEsc(n.max)}</small><small>${gsEsc(n.note)}</small></div>`;}).join("")}</div></div>`;
  el.innerHTML = css + `<div class="gs">${tabs}${sched}${all}${ing}</div>`;
}
document.addEventListener("click", e => {
  const t = e.target.closest && e.target.closest("[data-gsub]");
  if(t){ GS_SUB = t.dataset.gsub; document.querySelectorAll("[data-gsub]").forEach(b=>b.classList.toggle("on", b===t)); document.querySelectorAll("[data-gspane]").forEach(p=>p.style.display = p.dataset.gspane===GS_SUB ? "grid" : "none"); return; }
  const p = e.target.closest && e.target.closest("[data-gsp]"); if(p){ gsProductPop(+p.dataset.gsp); return; }
  const n = e.target.closest && e.target.closest("[data-gsnote]"); if(n){ const v = (window.GS_NOTES||{})[n.dataset.gsnote]; if(v) gsPop(gsEsc(v[0].replace(/^✕ /,"")), `<p>${gsEsc(v[1])}</p>`); }
});

renderAll();
(async () => {
  try { ART = window.claude && window.claude.use ? await window.claude.use("artifact") : null; } catch(e){ ART = null; }
  setSave(ART ? "Changes you make here are saved." : "");
})();
</script>
