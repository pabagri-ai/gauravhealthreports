 cell size)", "Blood smear review", "Iron panel and folate"], "preg": ["Gaurav's normal hemoglobin suggests his blood carries oxygen well.", "If the repeat shows unusual red cells, the couple's genetic carrier screening can also look for inherited blood traits such as thalassemia."]}, "MCHC": {"c": ["abs"], "why": "MCHC was high on both Hyderabad tests but normal (33.9) at a US lab in Nov 2025. That points to a lab or sample effect. Hereditary spherocytosis, a red cell condition that raises MCHC, is less likely, because a US lab found a normal MCHC 11 days before the Dec 2025 test.", "causes": ["Red cells clumping in a cold sample (cold agglutinins)", "Cloudy blood from fat or broken red cells interfering with the reading", "A hematocrit reading that is too low, since MCHC is worked out from it", "Hereditary spherocytosis, an inherited condition with round, fragile red cells", "Very dilute blood, such as low blood sodium"], "recheck": ["Repeat full blood count at a US lab, telling the lab about the past high MCHC", "Blood smear looked at under a microscope", "Further testing for hereditary spherocytosis only if the smear suggests it"], "preg": ["Hereditary spherocytosis is inherited, so if it were found, a child could inherit it, and that is useful to know before pregnancy.", "High MCHC often turns out to be a lab effect, and one careful repeat can show that."]}, "Lymphocytes": {"c": ["vir"], "k": "lymphocyte", "why": "The lymphocyte share was above 40% on all three tests, but the actual lymphocyte count was normal every time (2,830, 2,300 and 2,210; US lab range 700–3,100). The share looks high mainly because neutrophils were on the low side of normal. This pattern is called relative lymphocytosis and is most likely not a problem.", "causes": ["Neutrophils on the low side of normal, which makes the lymphocyte share look bigger", "A recent or lingering viral infection", "Normal variation between people"], "recheck": ["Routine repeat complete blood count, looking at the actual counts, not just the percents", "Further tests only if the actual lymphocyte count rises above the normal range"], "preg": ["Fertility doctors advise HIV, hepatitis B and hepatitis C screening for both partners before pregnancy."]}, "APTT (clotting time)": {"c": ["clot"], "why": "APTT was less than one second over the top of the range, once, in 2023. It is a small change that can come from how the sample was handled, but it was never repeated.", "causes": ["Sample handling, such as an under-filled tube", "Lupus anticoagulant, an antibody that lengthens the lab test but is linked to clots rather than bleeding", "A mild shortage of a clotting protein (factor 8, 9, 11 or 12); a factor 12 shortage does not cause bleeding", "Von Willebrand disease, the most common inherited bleeding disorder"], "recheck": ["Repeat APTT and PT (prothrombin time) from a clean arm-vein draw", "Mixing study if APTT is still long", "Clotting factor tests, von Willebrand tests or a lupus anticoagulant test, as the doctor decides", "A note of any easy bruising, nosebleeds or long bleeding after dental work"], "preg": ["This finding is about bleeding and clotting, not sperm.", "It matters before any procedure on Gaurav, such as a sperm retrieval, where bleeding risk counts.", "If a factor 8 or 9 shortage (hemophilia) were ever found, all of his daughters would carry the gene, because a father passes his X chromosome to every daughter."]}, "LDL cholesterol": {"c": ["heart", "lpa"], "why": "LDL was 148 at a US lab in Nov 2025 (measured directly), 117 in Hyderabad in Dec 2025 and 162 fasting at UW Health on Nov 23, 2026 (calculated). 160–189 is high on the standard US scale. The 2026 US cholesterol guideline says medicine can be considered early for young adults with LDL 160 or higher, and treats Lp(a) of 50 or higher as a reason for closer attention; the borderline stress test adds to the reason to look closely.", "causes": ["Diet high in saturated fat", "Family genes", "Low physical activity"], "recheck": ["Repeat 12-hour fasting lipid panel in about 6 months (Dr. Staddler, Nov 23, 2026), or sooner if the plan changes", "ApoB (apolipoprotein B), which counts all the particles that can clog arteries", "Blood pressure check", "A heart risk estimate with the PREVENT calculator, which can give a 30-year risk from age 30"], "preg": ["Lowering LDL with food changes and exercise is a safe first step while trying to conceive.", "Research on statins and sperm is mixed, with some studies showing changes and others not, so if a statin is suggested, Gaurav can ask the doctor about timing.", "European experts estimate that about 21 mg/dL lower LDL over a lifetime can offset the extra risk from about 50 mg/dL more Lp(a)."]}, "Lipoprotein(a)": {"c": ["lpa", "heart"], "k": "lipoprotein", "why": "Lp(a) was 112.4, almost four times the lab's limit of 30. At 100 or higher it is linked to at least twice the risk of heart disease. It is inherited and raises the lifetime risk of narrowed arteries, heart attack, stroke and a stiff aortic valve.", "causes": ["Inherited genes, which set more than 90% of the level", "Diet and lifestyle have very little effect on it"], "recheck": ["No need to repeat often, since it stays about the same for life", "Stronger LDL lowering, with LDL rechecked on the Nov 18, 2026 lipid panel", "Keep blood pressure, salt intake and blood sugar well controlled", "Cardiologist review together with the stress test follow-up", "Testing of parents and siblings, since it is inherited"], "preg": ["A child has about a 50% chance of inheriting high Lp(a) from a parent who has it.", "The CDC says relatives of someone with high Lp(a) should ask their doctor about checking theirs. That includes Gaurav's parents and siblings, and later his children.", "The only FDA-approved treatment aimed at high Lp(a) is lipoprotein apheresis, a blood-filtering procedure. It is only for people with inherited high cholesterol plus artery disease.", "No drug made to lower Lp(a) is approved yet. In Sep 2026, a large trial of one such drug (pelacarsen), in people who already had heart disease, reported that it did not meet its main goal. Other drugs are still being tested.", "The plan for now is to keep every other heart risk low."]}, "hsCRP": {"c": ["heart", "vir"], "why": "hsCRP was 1.46, in the average-risk group. Alongside high Lp(a) it adds a little to the heart picture, but one result is not enough to judge.", "causes": ["Low-level inflammation in the arteries", "A recent cold, infection or injury", "Other ongoing inflammation in the body"], "recheck": ["Repeat hsCRP twice, about two weeks apart, when he has been well", "Read it together with Lp(a), LDL and the stress test follow-up"], "preg": ["No fertility step is needed for this number by itself.", "If the raised value came from an illness with fever, that same illness can lower sperm quality for up to about 3 months."]}, "Total protein": {"c": ["abs"], "k": "protein", "why": "Total protein was a little under the MedPlus range in Dec 2025, but 6.4 is inside the US lab's range of 6.0–8.5. At a US lab 11 days earlier it was 6.8, with normal albumin (4.4) and globulin (2.4). The low reading was most likely a range or lab difference.", "causes": ["Low protein intake", "Poor absorption, such as celiac disease", "Protein loss through the kidneys", "Liver problems (his liver enzymes were normal)", "Lab range differences"], "recheck": ["Repeat with albumin and globulin (comprehensive metabolic panel)", "Urine test for protein", "Celiac blood test if folate, iron and protein all stay low"], "preg": ["Several nutrients that matter for sperm (folate, zinc, B12) were also near the low edge, so a low protein result is a reason to look at overall nutrition before trying to conceive.", "A clear albumin result also helps the doctor read zinc and cortisol correctly."]}, "Urine sodium": {"c": ["salt", "heart", "adr"], "k": "sodium", "why": "One urine sodium of 200 was above the lab range. It most often reflects a salty diet, but a single spot sample is a weak guide to daily salt intake.", "causes": ["Salty food in the meals before the test", "Water pills (diuretics) or some other medicines", "Low adrenal gland function", "Kidneys losing salt"], "recheck": ["Blood pressure in clinic and at home", "Blood sodium and potassium", "24-hour urine sodium if an accurate salt count is needed", "Renin and aldosterone if morning cortisol stays low"], "preg": ["The American Heart Association advises no more than 2,300 mg of sodium a day, about one teaspoon of salt, and ideally 1,500 mg.", "Less salt in household cooking helps blood pressure, which matters more with Gaurav's high Lp(a)."]}, "Testosterone, total": {"c": ["sperm"], "k": "testosterone", "why": "Total testosterone was normal at 375, and LH and FSH, the hormones that drive sperm making, were normal too.", "causes": ["Normal result, so there is no cause to look for"], "recheck": ["No repeat needed unless symptoms appear", "If it is ever rechecked, draw it between 7 and 11 a.m."], "preg": ["Testosterone pills, gels or shots should be avoided while trying to conceive, because they switch off the signals for sperm making.", "Normal hormones do not show sperm count or movement, so a semen analysis is still needed."]}, "Vitamin D": {"c": ["sperm", "abs"], "why": "Vitamin D was normal on both tests: 39.4 at a US lab in Nov 2025 and 32.1 in Hyderabad in Dec 2025, near the bottom of the range. Expert groups do not agree on one target, so this is not a clear shortage.", "causes": ["Little time in the sun", "Low intake of foods with vitamin D"], "recheck": ["The Endocrine Society does not advise routine retesting for healthy adults under 75", "A standard daily amount from food or a basic supplement, as his doctor advises"], "preg": ["A trial of 330 men with fertility problems and low vitamin D found that high-dose vitamin D did not improve semen quality overall.", "A standard daily amount is reasonable for general health, but high doses are not a proven fertility fix."]}, "Vitamin B12": {"c": ["abs", "sperm"], "why": "B12 was normal but in the lower part of the range. A low-normal B12 can still hide a mild shortage, and B12 matters for using folate and for sperm.", "causes": ["Eating little or no meat, fish, eggs or dairy", "Long-term acid-reducing medicines or metformin", "Poor absorption from the stomach or gut"], "recheck": ["Repeat B12 with methylmalonic acid (MMA)", "Homocysteine and folate at the same time"], "preg": ["A review links B12 to better sperm count and movement and less sperm DNA damage, though more clinical studies are needed.", "If a shortage is found, doctors treat it before starting folic acid."]}, "Zinc": {"c": ["sperm", "abs"], "why": "Zinc was normal but near the bottom of the range. Blood zinc moves with meals, time of day, illness and blood protein, so this is not a clear shortage.", "causes": ["Low zinc intake", "Eating before the blood draw (his blood was drawn at 8:00 a.m., so a late-day dip does not explain it)", "Slightly low blood protein lowering the reading", "A recent illness"], "recheck": ["Repeat zinc, fasting, early in the morning", "Albumin at the same time"], "preg": ["Men with fertility problems tend to have less zinc in semen, and some studies showed better sperm movement with zinc.", "But the large FAZST trial found zinc plus folic acid did not improve semen quality or live births, so a high-dose zinc supplement is not a proven fix."]}, "Homocysteine": {"c": ["heart", "abs"], "why": "Homocysteine was normal but in the upper part of the range, which fits with Gaurav's slightly low folate and low-normal B12.", "causes": ["Low folate, B12 or B6", "Alcohol", "Smoking", "Low thyroid", "Rare inherited conditions"], "recheck": ["Repeat homocysteine with folate, B12 and methylmalonic acid (MMA)"], "preg": ["High homocysteine in men has been linked to sperm DNA damage, though the research is still limited.", "Checking folate and B12 together shows whether a vitamin fix is needed."]}, "Non-HDL cholesterol": {"c": ["chol", "lpa", "heart"], "why": "Non-HDL 174 on Nov 23, 2026 is borderline high. It includes the cholesterol carried by Lp(a), which was 112.4 in Dec 2025.", "causes": ["Inherited cholesterol pattern", "Diet and activity", "Lp(a) cholesterol counted inside the number"], "recheck": ["Fasting lipid panel in about 6 months (Dr. Staddler)", "ApoB, which counts the particles directly"], "preg": ["Food changes and exercise are a safe first step while trying to conceive."]}, "BUN (kidney)": {"c": ["dehy"], "why": "BUN 22 with normal creatinine 1.14 after an overnight fast. The BUN-to-creatinine ratio (about 19) does not clearly point to one cause; less water, a high-protein diet or hard training are all possible. A kidney problem is less likely with a normal creatinine.", "causes": ["Less water before the draw (fasting)", "High-protein diet", "Hard training (about 6 workouts a week on WHOOP)", "Kidney problem (less likely with normal creatinine)"], "recheck": ["Repeat metabolic panel when well hydrated", "Urine albumin test if eGFR stays below 90"], "preg": ["No direct link to fertility."]}, "Chloride": {"c": ["labq"], "why": "Chloride 108 is 1 point above range, with normal sodium and bicarbonate. On its own this is very small.", "causes": ["Measuring variation", "Less water in the body"], "recheck": ["Repeat with the next metabolic panel"], "preg": ["No direct link to fertility."]}, "Anion gap": {"c": ["labq"], "why": "Anion gap 6 is 1 below range. The most common cause of a low anion gap is a small measuring error; albumin was normal.", "causes": ["Measuring error in sodium, chloride or bicarbonate", "Low albumin (not the case: 4.6)"], "recheck": ["Repeat with the next metabolic panel"], "preg": ["No direct link to fertility."]}};
const COND = {"heart": {"what": "The heart muscle gets its blood from small arteries on its surface, called coronary arteries. Cholesterol can build up in their walls over many years and narrow them. A narrowed artery may carry enough blood at rest but not during hard exercise. A treadmill stress test looks for signs of that on the heart tracing (ECG) during exercise. The treadmill test can give false alarms. In a large review, it missed about 1 in 3 people with narrowing and flagged about 1 in 4 people without it.", "hist": ["Treadmill stress test, Dec 5, 2025: borderline for reduced blood flow to the heart during exercise", "Lp(a) 112.4 mg/dL (limit 30), Dec 2025", "LDL 148 mg/dL and total cholesterol 219 mg/dL at a US lab (Labcorp), Nov 24, 2025", "LDL 117 mg/dL (goal under 100), Dec 2025", "LDL 162 mg/dL (fasting), total cholesterol 229 and non-HDL 174 at UW Health, Nov 23, 2026", "hsCRP 1.46 mg/L (lab range 0–1), Dec 2025", "Urine sodium 200 mmol/L (range 25–145), Dec 2025", "Reassuring, Dec 2025: echocardiogram normal with pumping strength 65%; troponin I under 2.50 and NT-proBNP 53.5, both normal; ECG normal rhythm with a breathing-related heart-rate change"], "tests": ["Cardiologist review of the Dec 2025 treadmill tracing", "Coronary CT angiography (a CT scan of the heart arteries), which guidelines favor for people under 65", "Or a stress echocardiogram (heart ultrasound during exercise)", "Fasting lipid panel and ApoB", "Blood pressure check"], "preg": ["A clear answer before trying to conceive lets the doctor say how hard Gaurav can safely exercise.", "If medicine is suggested, the doctor can talk through timing, since studies of statins and sperm are mixed."]}, "lpa": {"what": "Lp(a) is a cholesterol particle with an extra sticky protein. The level is set mostly by genes and stays about the same for life. High Lp(a) adds to the risk of narrowed arteries, heart attack, stroke and a stiff aortic valve. Diet and exercise barely change it. No drug made to lower it is approved yet, so the plan is to keep every other risk low.", "hist": ["Lp(a) 112.4 mg/dL in Dec 2025 (lab limit 30)", "LDL 148 mg/dL at a US lab (Labcorp), Nov 24, 2025", "LDL 117 mg/dL in Dec 2025", "LDL 162 mg/dL fasting at UW Health, Nov 23, 2026", "Borderline treadmill stress test, Dec 5, 2025"], "tests": ["One Lp(a) test is usually enough for life", "A US repeat is optional, to have it on record locally", "Testing of his parents and siblings", "Heart risk review with a cardiologist"], "preg": ["A child has about a 50% chance of inheriting high Lp(a) from a parent who has it.", "Knowing this now means the child's doctor can be told, and the child can be tested later."]}, "adr": {"what": "The adrenal glands sit on top of the kidneys and make cortisol. If they make too little, a person may have low blood pressure, dizziness, belly pain or darker skin. During a sudden illness, the body may not make enough cortisol to cope, which can lead to an emergency called an adrenal crisis. In India, tuberculosis is a known cause of adrenal gland damage. One morning test cannot confirm this. A stimulation test, where the doctor gives a shot of ACTH and checks whether cortisol rises, settles it.", "hist": ["Cortisol 3.70 µg/dL at 8:00 a.m. in Dec 2025 (expected about 6–18)", "DHEA-S 316 µg/dL in Dec 2025, normal (80–560), which is reassuring", "Urine sodium 200 mmol/L in Dec 2025; low adrenal function is one of several things that can raise it", "Grew up in India, and the Mar 2023 chest CT showed scarring", "WHOOP: the Dec 2025 cortisol was drawn 4–5 days after a 13½-hour time change, so jet lag may explain the low value"], "tests": ["Repeat 8:00 a.m. cortisol with ACTH", "ACTH (cosyntropin) stimulation test", "Blood sodium, potassium, renin and aldosterone", "A review of any steroid creams, inhalers or injections in the past year", "IGRA blood test for TB (QuantiFERON), which doctors also use when looking for a cause"], "preg": ["Untreated low cortisol can turn an ordinary illness into an emergency, so it is best settled before pregnancy and a newborn's first months.", "If Gaurav needs latent TB treatment, the drug rifampin speeds up cortisol breakdown and has triggered adrenal crisis in people with adrenal insufficiency, so the order of testing and treatment matters."]}, "pit": {"what": "The pituitary is a pea-sized gland under the brain. It sends signals to the adrenal glands (ACTH), the thyroid (TSH), the testes (LH and FSH) and the liver (growth hormone, which leads to IGF-1). If the pituitary underworks, more than one of these signals can drop. For example, low thyroid or low growth hormone can come along with low cortisol from a pituitary cause.", "hist": ["Cortisol 3.70 µg/dL at 8:00 a.m., Dec 2025 (low)", "IGF-1 107 ng/mL, Dec 2025, flagged low against a range that matches 14-year-old boys", "Free T3 2.58 pg/mL, Dec 2025, just below 2.66", "Against this, in Dec 2025: TSH 2.93, LH 5.71, FSH 3.24, prolactin 7.61 and testosterone 375 were all normal", "WHOOP: the Dec 2025 cortisol was drawn 4–5 days after a 13½-hour time change, so jet lag may explain the low value"], "tests": ["Repeat morning cortisol with ACTH (low ACTH with low cortisol points to the pituitary)", "Repeat IGF-1 at a US lab with adult age-based ranges", "Free T4 with TSH", "Brain imaging of the pituitary only if a pituitary cause is confirmed"], "preg": ["The pituitary drives sperm making through LH and FSH, and both were normal in Dec 2025, which is reassuring.", "A semen analysis shows directly whether sperm making is on track."]}, "ir": {"what": "Insulin is the hormone that moves sugar from the blood into cells. In insulin resistance, cells respond less, so the body makes more insulin to keep blood sugar normal. Blood sugar can stay normal for years while this builds. Low SHBG is closely linked to insulin resistance and to a higher future risk of type 2 diabetes. US diabetes guidelines advise testing Asian Americans at a lower BMI (body mass index) of 23 when they have at least one other risk factor, because type 2 diabetes tends to appear at a lower body weight.", "hist": ["SHBG 29.9 nmol/L in Dec 2025, below 32.4–128", "Fasting glucose 89 mg/dL and HbA1c 5.1% in Dec 2025, both normal", "Fasting insulin 9.03 and after-meal insulin 32.8 in Dec 2025, both inside the lab ranges"], "tests": ["Repeat SHBG", "Fasting glucose, fasting insulin and HbA1c; doctors can combine glucose and insulin into an insulin resistance score called HOMA-IR", "Waist size, weight and blood pressure", "Liver tests or a liver ultrasound for fatty liver if the doctor suspects it"], "preg": ["Metabolic syndrome, which includes insulin resistance, is linked in studies to lower sperm count, poorer movement and more sperm DNA damage.", "Sperm take roughly 2 to 3 months to form, so a semen analysis reflects health over the past few months."]}, "abs": {"what": "Several nutrients were low or near the low edge at the same time. This can happen when the diet is short on them, or when the gut does not absorb them well. Celiac disease is one gut cause. In celiac disease, gluten from wheat, barley and rye harms the lining of the small intestine, so it absorbs less iron, folate and other nutrients. A blood test can screen for it, but only while the person is still eating gluten.", "hist": ["Iron 58 µg/dL (range 70–180), Dec 2025, with normal ferritin 97.8", "Red cell folate 500.9 ng/mL (MedPlus range 523–1257), Dec 2025", "Magnesium 1.7 mg/dL (range 1.8–2.6), Dec 2025", "Total protein 6.4 g/dL (range 6.6–8.3), Dec 2025", "Hematocrit 38.9% (range 40–50), Dec 2025", "Near the low edge in Dec 2025: vitamin D 32.1, B12 243, zinc 72.63; homocysteine 11.9 near the top", "IGF-1 (107) and free T3 (2.58) can also drop when food intake is low", "H. pylori antibody negative, Dec 2025", "At a US lab, Nov 24, 2025: hematocrit 42.8, total protein 6.8, albumin 4.4 and vitamin D 39.4, all normal"], "tests": ["Celiac blood test (tTG-IgA, with total IgA), done while still eating gluten", "Repeat iron panel, folate, B12 with MMA, magnesium, zinc and albumin at one US lab", "Urine protein test", "A dietitian review of a typical week of meals"], "preg": ["Folate, zinc, B12 and vitamin D all play a part in making sperm, and Gaurav's were low or near the low edge.", "Supplements have not been proven to treat male infertility, and high-dose folic acid with zinc raised sperm DNA damage in one large trial, so finding the cause and eating well come first.", "Older reports found semen problems in men with celiac disease that got better on a gluten-free diet, though there is little newer research. So the celiac test is worth asking about before trying to conceive, especially if folate, iron and protein stay low on a repeat."]}, "lung": {"what": "A chest CT (computed tomography) scan is a detailed X-ray picture of the chest. Widened airways are called bronchiectasis. In India, past TB and other lung infections are the most common causes. The right middle lobe airway is long and narrow, so it is prone to blockage and later widening. Rarely, inherited conditions that affect the tiny hairs lining the airways (primary ciliary dyskinesia) or the cystic fibrosis gene cause both widened airways and male infertility.", "hist": ["Mar 2023 chest CT: minimal scarring and a few slightly widened airways in the right middle lobe", "Mar 2023 chest CT: a few small lymph nodes in the middle of the chest, called non-specific", "Mar 2023 sputum tests: no TB growth after 6 weeks and no cancer cells", "Mar 2023 lung function test: done in Hyderabad, but no result recorded"], "tests": ["Repeat lung function test (spirometry)", "Lung specialist review of the 2023 CT images", "A new CT only if the specialist or symptoms call for it", "IGRA blood test for latent TB"], "preg": ["If a semen analysis showed sperm that do not move, or no sperm, doctors would think about the cilia and cystic fibrosis gene causes, since these can link the lungs and fertility.", "Recommended carrier screening before pregnancy includes the cystic fibrosis gene."]}, "tb": {"what": "Latent TB means TB germs are in the body but asleep. A person with latent TB has no symptoms and cannot spread TB. Without treatment, about 5 to 10 of every 100 people with latent TB develop active TB in their lifetime, and active TB can spread through the air. People born in countries where TB is common are advised to be tested. The IGRA blood test (QuantiFERON) is preferred for people who had the BCG vaccine, because BCG can make the skin test falsely positive but does not affect the blood test. Treatment takes 3 to 4 months and is about 90% effective at preventing TB disease.", "hist": ["Grew up in India", "Mar 2023 chest CT: scarring and slightly widened airways in the right middle lobe, plus small non-specific lymph nodes in the middle of the chest", "Mar 2023 sputum culture: no TB growth after 6 weeks (this checks for active TB, not latent TB)", "No latent TB test on record"], "tests": ["IGRA blood test (QuantiFERON)", "Chest X-ray if the IGRA is positive, to rule out active TB", "A short treatment course (3 or 4 months) if latent TB is confirmed"], "preg": ["Children under 5 are more likely to get sick soon after TB infection, and babies are more likely to get severe forms such as TB meningitis.", "Latent TB cannot spread, but treating it before the baby arrives lowers the chance it wakes up and becomes contagious later in the household.", "The preferred short treatments use rifampin or a related drug, rifapentine, and both speed up cortisol breakdown, so the doctor should know about Gaurav's low morning cortisol first."]}, "vir": {"what": "Some viruses, such as Epstein-Barr virus (the cause of mono) or cytomegalovirus, can raise the number of lymphocytes. Other infections, including early HIV and TB, can raise them too. A blood smear can show lymphocytes that look 'activated', which points to a virus. The actual lymphocyte count, not only the percent, shows whether there is a true excess.", "hist": ["Lymphocytes 44.8% (Mar 2023) and 47.4% (Dec 2025), above the 20–40% range", "hsCRP 1.46 mg/L in Dec 2025", "Small non-specific lymph nodes in the middle of the chest on the Mar 2023 CT", "ESR 2 mm/hr on both tests, normal"], "tests": ["Full blood count with the absolute lymphocyte count and a blood smear", "HIV, hepatitis B and hepatitis C tests", "Other virus tests as the doctor decides", "Flow cytometry only if the count stays high for more than a month without a clear cause"], "preg": ["Fertility doctors advise HIV, hepatitis B and hepatitis C screening for both partners, so these tests serve both purposes.", "A moderate or high fever can lower sperm count and movement for up to about 3 months, so a semen analysis is best timed away from a recent feverish illness."]}, "clot": {"what": "Blood clotting depends on a chain of clotting proteins called factors. If one factor runs low, the lab clotting time gets longer, and the person may bruise or bleed more easily. Some causes lengthen the lab test without causing bleeding, such as a factor 12 shortage. An antibody called lupus anticoagulant also lengthens the test but is linked to clots rather than bleeding. A slightly long result can also come from how the sample was taken or handled.", "hist": ["APTT 34.9 seconds in Mar 2023 (range 25–34), not repeated since", "Platelets normal: 2.51 lakhs/cumm (Mar 2023) and 2.19 (Dec 2025)"], "tests": ["Repeat APTT and PT (prothrombin time)", "Mixing study if APTT is still long", "Clotting factor tests, von Willebrand tests or a lupus anticoagulant test, as the doctor decides", "A personal and family history of bleeding"], "preg": ["This finding is about bleeding and clotting, not sperm.", "It matters before any fertility procedure on Gaurav, such as a sperm retrieval.", "If a factor 8 or 9 shortage (hemophilia) were found, all of his daughters would carry the gene, because a father passes his X chromosome to every daughter."]}, "salt": {"what": "Table salt is about 40% sodium. Extra sodium leaves the body in urine, so urine sodium rises with a salty diet. Cutting sodium helps lower blood pressure. The American Heart Association advises no more than 2,300 mg of sodium a day, about one teaspoon of salt, and ideally 1,500 mg for most adults. A single urine sample is a weak guide to daily intake. A 24-hour urine collection is more reliable.", "hist": ["Urine sodium 200 mmol/L in Dec 2025 (range 25–145)", "Blood pressure 104/62 at the Nov 18, 2026 visit", "Lp(a) 112.4 and a borderline stress test, which make blood pressure control more important", "Blood sodium 140 and potassium 4.5, both normal, Nov 23, 2026"], "tests": ["Blood pressure in clinic and at home", "24-hour urine sodium if an accurate count is wanted", "Renin and aldosterone if morning cortisol stays low"], "preg": ["Less salt in household cooking makes it easier for Gaurav to keep his own intake down.", "This is a heart item more than a fertility item, but it fits the same before-pregnancy health check."]}, "sperm": {"what": "A semen analysis is the main test of male fertility. It counts sperm and checks how well they move and how they are shaped. US urology and fertility guidelines say a man's first fertility check should include a reproductive history and at least one semen analysis, and that both partners should be checked at the same time. Blood hormone tests show the signals for making sperm, but not the sperm themselves. Sperm take roughly 2 to 3 months to form, so a result reflects health over the past few months.", "hist": ["No semen analysis on record", "Normal in Dec 2025: testosterone 375, free testosterone 8.24, LH 5.71, FSH 3.24, prolactin 7.61 and estradiol 17.7", "Dec 2025: folate slightly low; zinc, B12 and vitamin D near the low edge; homocysteine near the top", "SHBG low at 29.9 in Dec 2025, which can go with insulin resistance", "Slightly widened airways on the Mar 2023 CT, which in rare inherited conditions link to sperm movement problems"], "tests": ["Semen analysis, usually after 2 to 7 days without ejaculation", "Results are compared with World Health Organization 2021 lower limits, such as 16 million sperm per mL and 30% moving forward", "A repeat semen analysis if the doctor wants to confirm an abnormal result", "More hormone tests and genetic tests, usually only if the semen analysis shows a problem"], "preg": ["This is the most direct way to know whether sperm count and movement are on track.", "Testosterone products should be avoided while trying to conceive, because they shut down sperm making.", "Antioxidant and vitamin supplements have not been proven to treat male infertility.", "A feverish illness can lower sperm for up to about 3 months, so the test is fairest after a well stretch.", "UW Health Fertility Care can check both partners, which may mean fewer separate visits."]}, "jet": {"what": "The body's daily clock takes days to adjust after a long flight. Cortisol follows that clock, so a morning test taken soon after crossing many time zones can read low even when the adrenal glands work normally. Short, broken sleep can do the same.", "hist": ["WHOOP: time zone changed from US Pacific time to India time (13½ hours) on Nov 30, 2025", "Blood drawn at 8:00 a.m. India time on Dec 5, 2025, 4–5 days after landing", "WHOOP: only 3 h 20 min of sleep on the night of Dec 3, 2025", "WHOOP: he usually sleeps about 6–7 hours, against an estimated need of 8–9"], "tests": ["Repeat 8:00 a.m. cortisol with ACTH in Madison, at least 2 weeks after any long flight", "Keep a normal sleep schedule for the week before the repeat test"], "preg": ["If the repeat is normal, no adrenal treatment is needed, and nothing changes the plan to conceive.", "If the repeat is still low, the adrenal and pituitary tests should be finished before pregnancy."]}, "chol": {"what": "LDL is the cholesterol that builds up in artery walls. On the standard US scale, an LDL under 100 is optimal, 100–129 is near optimal and 130–159 is borderline high and 160–189 is high. A total cholesterol of 200–239 is borderline high. Food, exercise, weight and family genes all affect LDL. Because Gaurav also has high Lp(a), guidelines say it matters more to keep his LDL low.", "hist": ["LDL 148 mg/dL (measured directly) and total cholesterol 219 mg/dL at a US lab (Labcorp), Nov 24, 2025", "LDL 117 mg/dL and total cholesterol 181 mg/dL in Hyderabad, Dec 2025", "LDL 162 mg/dL (calculated, fasting), total cholesterol 229, non-HDL 174, HDL 55 and triglycerides 68 at UW Health, Nov 23, 2026", "HDL 51 mg/dL both times; triglycerides 111 (Nov 2025) and 66 (Dec 2025), both normal", "Lp(a) 112.4 mg/dL in Dec 2025, an inherited heart risk that makes LDL lowering more important", "Borderline treadmill stress test, Dec 5, 2025"], "tests": ["Repeat 12-hour fasting lipid panel in about 6 months (Dr. Staddler, Nov 23, 2026)", "ApoB (apolipoprotein B), which counts all the particles that can clog arteries", "Family history of early heart disease or high cholesterol", "A heart risk estimate with the doctor, using LDL, Lp(a), blood pressure and the stress test result"], "preg": ["Food changes and regular exercise are a safe first step while trying to conceive.", "Research on statins and sperm is mixed, so if a statin is suggested, Gaurav can ask the doctor about timing.", "Sperm take roughly 2 to 3 months to form, so health changes made now show up in sperm a few months later."]}, "dehy": {"what": "BUN is a waste made from protein that the kidneys clear. Less water in the body, a high-protein diet and hard training can all raise BUN without raising creatinine. A kidney problem usually raises both BUN and creatinine together.", "hist": ["BUN 22 mg/dL (range 9–20) on Nov 23, 2026, after an overnight fast", "Creatinine 1.14 mg/dL, normal", "eGFR 88 (97 in Nov 2025)"], "tests": ["Repeat metabolic panel when well hydrated", "Urine albumin test if eGFR stays below 90"], "preg": ["No direct link to fertility."]}, "labq": {"what": "Some lab numbers are worked out from others. The anion gap is sodium minus chloride and bicarbonate, so a small error in one salt moves the gap. The most common cause of a low anion gap is a measuring error.", "hist": ["Chloride 108 (range 98–107) and anion gap 6 (range 7–14) on Nov 23, 2026", "Sodium 140, bicarbonate 26 and albumin 4.6, all normal"], "tests": ["Repeat with the next metabolic panel"], "preg": ["No direct link to fertility."]}};
const PLAIN = {"SHBG": {"w": ["SHBG stands for sex hormone-binding globulin. It is a protein made by the liver. It carries testosterone and other sex hormones through the blood, like a bus carrying passengers.", "A hormone riding on the bus is not free to work. When SHBG is low, more of the hormone is free. Low SHBG is closely linked to insulin resistance, where the body has to make extra insulin to keep blood sugar normal."], "y": ["Gaurav's SHBG was 29.9 nmol/L in Dec 2025.", "The lab range is 32.4–128, so his result was a little below it.", "His free testosterone was normal at 8.24 ng/dL (range 4.7–24.4).", "His fasting glucose (89) and HbA1c (5.1%) were normal, so these results do not show diabetes.", "Because low SHBG can go with insulin resistance, it is worth a recheck."]}, "Cortisol": {"w": ["Cortisol is a stress hormone. The adrenal glands, which sit on top of the kidneys, make it. It helps keep blood pressure and blood sugar steady and helps the body cope with illness.", "Cortisol follows a daily clock. It is highest in the early morning and much lower late at night. A morning test is like checking a pot of water at the time it should be boiling."], "y": ["Gaurav's cortisol was 3.70 µg/dL at 8:00 a.m. in Dec 2025.", "A usual morning level is about 6–18, so his was low for that time of day.", "WHOOP shows Gaurav flew from the US to India on Nov 30, 2025, a 13½-hour time change. The blood was drawn at 8:00 a.m. India time on Dec 5, only 4–5 days after landing, and his sleep that week was short and broken (3 h 20 min on the night of Dec 3). In a study of people flying east across more than five time zones, the cortisol daily clock stayed on home time, and morning cortisol was lower than normal. At 8:00 a.m. in India, his body clock may still have been closer to evening, when cortisol is naturally low.", "One low result does not prove a problem, because steroid medicines (including creams, inhalers and joint shots), a sleep schedule that runs late and differences between lab methods can all make a morning reading low.", "His DHEA-S, another adrenal hormone, was normal at 316 µg/dL (range 80–560). One medical review cites a study in which a DHEA-S above 100 ruled out adrenal insufficiency, which means the body not making enough cortisol, with good accuracy. This is reassuring. A repeat cortisol test is still needed, because the review calls this cut-off good, not perfect, and cites only one study for it.", "A repeat morning test with ACTH, and if needed a stimulation test, can settle it."]}, "IGF-1": {"w": ["IGF-1 stands for insulin-like growth factor 1. The liver makes it when growth hormone from the pituitary gland tells it to. Doctors use IGF-1 as a stand-in for growth hormone, because growth hormone itself rises and falls through the day.", "IGF-1 changes a lot with age. It rises to a peak in the teenage years and then slowly falls through adult life. So the right range depends on age, like a shoe size that changes as a child grows."], "y": ["Gaurav's IGF-1 was 107 ng/mL in Dec 2025, when he was 30.", "The MedPlus Hyderabad lab printed a range of 220–972 and marked it low.", "That exact range matches a published range for 14-year-old boys, not for adults.", "Published ranges for men in their late 20s and early 30s start between about 88 and 117, depending on the lab method.", "So his result is low-normal or just below normal, and a repeat at a US lab with an adult age-based range would clear this up."]}, "Free T3": {"w": ["T3 is the active thyroid hormone. The thyroid gland in the neck makes mostly T4, and the body turns T4 into T3. Free T3 is the part not tied to proteins, ready to work.", "Thyroid hormone sets the body's speed, like the idle setting on a car engine. TSH (thyroid-stimulating hormone) is the signal from the pituitary gland that tells the thyroid how hard to work."], "y": ["Gaurav's free T3 was 2.58 pg/mL in Dec 2025.", "The lab range is 2.66–4.33, so it was just below the bottom.", "His TSH was normal at 2.93 µIU/mL.", "A slightly low T3 with a normal TSH often comes from eating less, a recent illness or physical stress, rather than thyroid disease.", "A repeat with free T4 can show whether it was a one-time dip."]}, "Folate (red cell)": {"w": ["Folate is vitamin B9. It comes from leafy greens, beans, lentils and fortified grains. The body needs it to copy DNA, so it matters for cells that divide fast, including sperm.", "Red cell folate measures the folate stored inside red blood cells. It reflects a longer stretch of time than a blood folate test, which can change after one meal."], "y": ["Gaurav's red cell folate was 500.9 ng/mL in Dec 2025.", "The MedPlus range is 523–1257, so it was a little below that lab's range.", "Folate ranges differ a lot between labs and test methods. One US hospital lists 140–628 ng/mL as normal, and his result sits inside that range.", "So this is a borderline result, not a clear shortage.", "A repeat at a US lab, with B12 checked at the same time, would show where he stands."]}, "Iron": {"w": ["Serum iron is the iron in the blood at the moment of the test. Iron helps red blood cells carry oxygen.", "Serum iron goes up and down through the day and after meals, like the water level in a tub with the tap and the drain both open. Ferritin, the iron storage protein, is a better guide to how much iron the body has saved."], "y": ["Gaurav's serum iron was 58 µg/dL in Dec 2025, below the 70–180 range.", "His ferritin, the storage measure, was normal at 97.8 ng/mL (range 30–400).", "His transferrin saturation, which shows how full the iron carrier is, was normal at 19.3% (range 15–50).", "His hemoglobin was normal at 14.2 g/dL.", "Together this points to a low reading on that day, not empty iron stores."]}, "Magnesium": {"w": ["Magnesium is a mineral. It helps muscles relax, nerves send signals and the heart keep a steady beat.", "Most of the body's magnesium sits inside bones and cells, not in the blood. So a blood test is like looking at the cash in a wallet, not the savings account. A blood level can even look normal when the stores are low."], "y": ["Gaurav's magnesium was 1.7 mg/dL in Dec 2025.", "The range is 1.8–2.6, so it was just below normal.", "Common reasons include low intake, loose stools, alcohol, and some medicines such as long-term acid reducers or water pills.", "Low magnesium often comes with low potassium or low calcium, so those are worth checking at the same time."]}, "Hematocrit": {"w": ["Hematocrit is the share of the blood made up of red blood cells. It is shown as a percent.", "Picture a glass of blood left to settle. The red cells sink to the bottom. Hematocrit is how much of the glass the red layer fills."], "y": ["Gaurav's hematocrit was 44.7% in Mar 2023 and 38.9% in Dec 2025 in Hyderabad.", "That lab's range is 40–50, so the Dec 2025 result was a little low. The US lab's range (37.5–51.0) would have counted 38.9 as normal.", "His hemoglobin, the oxygen carrier, was normal on all three tests.", "The high MCHC on the Dec 2025 test is worked out from hematocrit, so a hematocrit reading that is off would push MCHC up.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, 11 days before the Dec 2025 test, his hematocrit was 42.8% (range 37.5–51.0), normal. This makes a lab difference more likely than a true drop in red cells."]}, "MCHC": {"w": ["MCHC stands for mean corpuscular hemoglobin concentration. It tells how packed each red blood cell is with hemoglobin, the protein that carries oxygen.", "The machine does not measure MCHC directly. It works it out by dividing hemoglobin by hematocrit. So if one of those numbers is off, MCHC comes out wrong, like a math answer thrown off by one bad number."], "y": ["Gaurav's MCHC was 34.9 g/dL in Mar 2023 and 36.5 g/dL in Dec 2025 in Hyderabad.", "That lab's range is 31.5–34.5, so both were flagged high. The US lab's range (31.5–35.7) would have counted the 2023 result as normal.", "A high MCHC is often a lab effect, such as red cells clumping in a cold sample or cloudy blood interfering with the reading.", "In one study of MCHC results above 36.5, about 3 in 10 were lab effects and about 1 in 7 came from a true red cell condition.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, 11 days before the Dec 2025 test, his MCHC was 33.9 g/dL (range 31.5–35.7), normal. This makes a lab effect more likely."]}, "Lymphocytes": {"w": ["Lymphocytes are a type of white blood cell. They fight viruses and make antibodies, and they remember germs the body has met before.", "A blood count reports lymphocytes two ways: as a percent of all white cells, and as the actual number of cells. Lymphocytes are usually about 20 to 40% of white cells. The actual number is the more useful one. The percent can rise just because another white cell type is lower, like one slice of a pie looking bigger when the other slices shrink."], "y": ["Gaurav's lymphocyte share was 44.8% in Mar 2023, 44% in Nov 2025 (US lab) and 47.4% in Dec 2025, all above the 20–40% range.", "His actual lymphocyte count was normal all three times: 2,830, 2,300 and 2,210 cells per microliter (normal about 700–3,100).", "His total white cell count was normal all three times (6,320, 5,200 and 4,660).", "His neutrophils, another white cell type, were on the low side of normal (2,050 in Dec 2025). That makes the lymphocyte share look high.", "A high share with a normal actual count is called relative lymphocytosis. It is most likely not a problem. A routine repeat blood count is enough."]}, "APTT (clotting time)": {"w": ["APTT stands for activated partial thromboplastin time. It measures how many seconds a blood sample takes to clot in the lab.", "Clotting works like a row of dominoes, with each clotting protein knocking over the next. APTT checks one part of that row. A longer time can mean one domino is weak, or that something in the sample slowed the test down."], "y": ["Gaurav's APTT was 34.9 seconds in Mar 2023.", "The range is 25–34, so it was less than one second over.", "It was tested only once and was not repeated in Dec 2025.", "Small rises can come from how the sample was collected or handled.", "A repeat test, and a mixing test if it is still long, would settle it."]}, "LDL cholesterol": {"w": ["LDL stands for low-density lipoprotein. It is called the 'bad' cholesterol because it can build up in the walls of arteries.", "Think of LDL particles as delivery trucks. The more trucks on the road, the more of them bump into the artery walls and leave debris behind. Over many years, that debris can narrow the arteries."], "y": ["Gaurav's LDL was 148 mg/dL at a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, measured directly.", "It was 117 mg/dL in Dec 2025 in Hyderabad.", "Both are above the goal of under 100. On the standard US scale, 100–129 is near optimal and 130–159 is borderline high, so the Nov 2025 result was borderline high.", "His HDL (51) and triglycerides (111 in Nov 2025, 66 in Dec 2025) were in range.", "His high Lp(a) makes LDL more important, because guidelines say people with high Lp(a) should keep their other risks lower.", "On Nov 23, 2026 at UW Health (fasting): 162 mg/dL (calculated), the highest of his three tests (148 in Nov 2025, 117 in Dec 2025). Dr. Staddler advised exercise, Mediterranean-style eating and a 12-hour fasting recheck in 6 months.", "On the standard US scale, 160–189 is high, so 162 sits in the high band. The 2026 US cholesterol guideline (ACC/AHA) says medicine can be considered early for young adults with LDL 160 or higher, or with a strong family history of early heart disease.", "The Nov 2025 value was measured directly; the Nov 2026 value was calculated, a different method, so small differences between them are expected."]}, "Lipoprotein(a)": {"w": ["Lp(a), said 'L-P-little-a', stands for lipoprotein(a). It is a cholesterol particle, much like LDL, with an extra sticky protein attached.", "Lp(a) is set mostly by genes. More than 90% of the level comes from inheritance, so it stays about the same for life. Diet and exercise barely change it, so one test is usually enough."], "y": ["Gaurav's Lp(a) was 112.4 mg/dL in Dec 2025. His lab's limit is under 30.", "Under the 2026 cholesterol guideline, Lp(a) of 50 or higher is a risk-enhancing factor, linked to about 1.4 times the risk of heart disease. Levels of 100 or higher are linked to at least twice the risk. Gaurav is in that top group.", "High Lp(a) is a lifelong risk factor, not proof of heart disease on its own.", "It calls for stronger LDL lowering and tighter control of other risks. His LDL (162 fasting on Nov 23, 2026), his blood pressure and salt intake, and the borderline treadmill test follow-up all matter more because of it.", "Diet and exercise barely change Lp(a), so the focus is on LDL."]}, "hsCRP": {"w": ["hsCRP stands for high-sensitivity C-reactive protein. The liver makes CRP when there is inflammation anywhere in the body.", "The high-sensitivity test picks up very small amounts, like a smoke detector set to notice a faint whiff. Low-level inflammation in artery walls is linked to heart risk. But a cold, an infection or an injury can also raise it."], "y": ["Gaurav's hsCRP was 1.46 mg/L in Dec 2025.", "Heart groups sort results into under 1 (lower risk), 1 to 3 (average risk) and over 3 (higher risk), so his falls in the average group.", "His Mar 2023 result of 0.60 was a regular CRP test, so the two numbers cannot be compared directly.", "Guidance says to measure it twice, about two weeks apart, at a time when he is well."]}, "Total protein": {"w": ["Total protein adds up all the proteins in the liquid part of the blood. The two main groups are albumin and globulins.", "Albumin keeps fluid inside blood vessels and carries hormones and minerals. Globulins include the antibodies that fight infection. Total protein is like counting all the vehicles on a road without knowing which are cars and which are buses."], "y": ["Gaurav's total protein was 6.4 g/dL in Dec 2025 in Hyderabad.", "The MedPlus range is 6.6–8.3, so the Dec 2025 result was a little low.", "The US lab's range is 6.0–8.5, and by that range 6.4 would count as normal.", "The Dec 2025 report did not show albumin and globulin separately.", "Low blood protein can make zinc read lower, because most zinc in the blood travels on albumin.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, 11 days before the Dec 2025 test, his total protein was 6.8 g/dL, normal, with albumin 4.4 and globulin 2.4, both normal. So the low Dec 2025 reading was most likely a range or lab difference.", "On Nov 23, 2026 at UW Health (fasting): 7.4 g/dL, normal (UW range 6.4–8.3). This supports the Dec 2025 low reading being a lab difference."]}, "Urine sodium": {"w": ["Urine sodium measures how much sodium, the main part of salt, is in a urine sample. The kidneys get rid of extra sodium through urine.", "A single urine sample is a snapshot. It changes with recent meals and with how much a person drank. A 24-hour urine collection is a better guide to daily salt intake, like a full day of video instead of one photo."], "y": ["Gaurav's urine sodium was 200 mmol/L in Dec 2025.", "The lab range is 25–145, so it was high.", "The most common reason is a salty diet, but water pills, kidney salt loss and low adrenal function can also raise it.", "Because his morning cortisol was also low, a doctor may want to check blood sodium and potassium too.", "A blood pressure check is a simple first step."]}, "Testosterone, total": {"w": ["Testosterone is the main male hormone. The testes make it when the pituitary gland sends a signal called LH (luteinizing hormone). It supports muscle, energy, sex drive and sperm making.", "Total testosterone counts all of it, both the part riding on proteins and the free part. Levels are highest in the morning, so the test is best done between about 7 and 11 a.m."], "y": ["Gaurav's total testosterone was 375 ng/dL in Dec 2025.", "The lab range is 197–670, so it was normal.", "US urology guidance uses under 300 as a sign of low testosterone, and his result is above that.", "His free testosterone (8.24), LH (5.71) and FSH (3.24) were also normal.", "This means the hormone signals for making sperm look normal, but only a semen analysis can show the sperm themselves."]}, "Vitamin D": {"w": ["Vitamin D helps the body take in calcium for strong bones. Skin makes it in sunlight, and small amounts come from foods such as fish, eggs and fortified milk.", "The blood test measures 25-hydroxyvitamin D, the storage form. Expert groups do not agree on one cut-off for 'enough', so lab ranges vary."], "y": ["Gaurav's vitamin D was 32.1 ng/mL in Dec 2025 in Hyderabad.", "That lab's range is 31–100, so the Dec 2025 result was normal but near the bottom.", "The Endocrine Society's 2024 guideline says experts could not set a clear target level, and it does not advise routine testing for healthy adults under 75.", "A trial of 330 men with fertility problems found that vitamin D did not improve semen quality overall.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, his vitamin D was 39.4 ng/mL (range 30–100), also normal."]}, "Vitamin B12": {"w": ["Vitamin B12 helps make red blood cells, keeps nerves healthy and helps copy DNA. It comes mainly from meat, fish, eggs and dairy, and from fortified foods.", "Folate and B12 work as a team. Doctors check both together, and they treat a B12 shortage before giving folic acid."], "y": ["Gaurav's B12 was 243 pg/mL in Dec 2025.", "His lab range is 197–771, so it was normal but in the lower part.", "A level under 150 clearly shows a shortage.", "When the level is low-normal, a test called methylmalonic acid (MMA) can show whether the body is truly short.", "Eating little or no animal food, or taking long-term acid reducers or metformin, raises the chance of low B12."]}, "Zinc": {"w": ["Zinc is a mineral. It helps the immune system, wound healing and sperm making.", "Blood zinc changes through the day. It is lowest in the evening, can drop after meals and falls during illness. So it is best measured early in the morning before eating, like weighing oneself at the same time each day."], "y": ["Gaurav's zinc was 72.63 µg/dL in Dec 2025.", "His lab range is 70–120, so it was normal but near the bottom.", "About 60% of blood zinc rides on albumin, so his slightly low total protein could pull the reading down.", "A large trial found that zinc plus folic acid pills did not improve semen quality or birth rates."]}, "Homocysteine": {"w": ["Homocysteine is a substance the body makes when it breaks down protein. The body clears it using folate, B12 and B6.", "When those vitamins run low, homocysteine builds up, like dishes piling up in a sink when the dishwasher is slow. High levels are linked to heart disease and to damage in sperm DNA."], "y": ["Gaurav's homocysteine was 11.9 µmol/L in Dec 2025.", "His lab range is 3.7–13.9, so it was normal but in the upper part.", "Many labs call levels under about 15 normal.", "His folate was slightly low and his B12 low-normal, and both can push homocysteine up.", "Rechecking it with folate and B12 shows whether the three move together."]}, "Testosterone, free": {"w": ["Most testosterone in the blood rides on proteins. The main ones are SHBG (sex hormone-binding globulin) and albumin. Only about 2% floats free, and the free part is the part the body can use most easily.", "Free testosterone is hard to measure directly, so many labs work it out from total testosterone and SHBG. When SHBG is unusually high or low, the free level can differ from what the total suggests. Testosterone is highest in the morning, so the blood is best drawn between 7 and 10 a.m."], "y": ["Gaurav's free testosterone was 8.24 ng/dL in Dec 2025.", "The lab range is 4.7–24.4, so it was normal, in the lower part of the range.", "His blood was drawn at 8:00 a.m. India time, inside the usual 7 to 10 a.m. window. But it was drawn only 4–5 days after a long flight from the US, so 8:00 a.m. may not yet have been his body's morning.", "His SHBG was a little low (29.9). Low SHBG can pull total testosterone down while free testosterone stays the same, so the free and total numbers are best read together.", "His total testosterone was also normal at 375 ng/dL."]}, "FSH": {"w": ["FSH stands for follicle-stimulating hormone. The pituitary gland, a small gland at the base of the brain, makes it. In men, FSH tells the testes how much sperm to make.", "Doctors check FSH when looking for the cause of a low sperm count or trouble getting a partner pregnant. A high FSH is often a sign of a problem in the testes. A low FSH can point to a problem with the pituitary gland or the part of the brain that controls it."], "y": ["Gaurav's FSH was 3.24 mIU/mL in Dec 2025.", "The lab range is 1.5–12.4, so it was normal, in the lower part of the range.", "An FSH near the top of the normal range can hint at a sperm-making problem, and his is far from the top.", "Still, many men with sperm problems have a normal FSH, so this result does not prove the sperm are healthy.", "A semen analysis, which has not been done yet, is the main test for that."]}, "LH": {"w": ["LH stands for luteinizing hormone. The pituitary gland at the base of the brain makes it. In men, LH tells the testes to make testosterone, which is needed to make sperm.", "Doctors usually check LH together with FSH (follicle-stimulating hormone) and testosterone, because reading them together shows where a problem starts. Low testosterone with high LH points to the testes. Low testosterone with low LH points to the pituitary gland or the brain."], "y": ["Gaurav's LH was 5.71 mIU/mL in Dec 2025.", "The lab range is 1.7–8.6, so it was normal.", "His total testosterone (375) and FSH (3.24) were normal too.", "When all three are normal, the hormone signals between the brain and the testes look normal."]}, "Estradiol": {"w": ["Estradiol is the main form of estrogen. Men make small amounts of it. Some comes from the testes, and some is made from testosterone in body fat and muscle.", "In men, estradiol helps keep sperm from dying too early. Too much can cause breast growth and is linked to infertility. A man's estrogen level does not change much through life, so a high level usually means there is a cause to look for."], "y": ["Gaurav's estradiol was 17.7 pg/mL in Dec 2025.", "His lab report marked it normal for a man but did not print a number range.", "MedlinePlus, from the US National Library of Medicine, lists 10–50 pg/mL as normal for men, and his result sits inside that, toward the lower end. Ranges differ a little between labs.", "So this result does not point to a hormone problem."]}, "Prolactin": {"w": ["Prolactin is a hormone made by the pituitary gland at the base of the brain. Its main job is to help the breasts make milk after a baby is born. Men have it too, at low levels.", "In men, high prolactin can cause low sex drive, trouble with erections and breast growth. Doctors check it when a man has these problems or trouble getting a partner pregnant. The most common cause of a high level is a small non-cancer growth on the pituitary gland. Stress, exercise and some medicines can raise it a little, and the level changes through the day."], "y": ["Gaurav's prolactin was 7.61 ng/mL in Dec 2025.", "The lab range is 2.1–17.7, so it was normal and well below the top.", "His testosterone, LH and FSH were normal too.", "So prolactin does not point to a problem with his fertility hormones."]}, "DHEA-S": {"w": ["DHEA-S stands for dehydroepiandrosterone sulfate. It is a hormone made mostly by the adrenal glands, which sit on top of the kidneys. Smaller amounts come from the testes.", "The body uses DHEA-S to help make testosterone and estrogen. Doctors check it to see how well the adrenal glands are working. Levels are highest around puberty and fall slowly with age."], "y": ["Gaurav's DHEA-S was 316 µg/dL in Dec 2025.", "The lab range is 80–560, so it was normal, near the middle.", "This matters because his morning cortisol, another adrenal hormone, was low on the same day.", "A medical review cites a study in which a DHEA-S above 100 ruled out adrenal insufficiency, which means the body not making enough cortisol, with good accuracy. His result is about three times that.", "This is reassuring, but it does not replace the repeat morning cortisol test already on his list."]}, "TSH": {"w": ["TSH stands for thyroid-stimulating hormone. The pituitary gland at the base of the brain makes it. TSH tells the thyroid gland in the neck how much thyroid hormone to make.", "TSH works like a thermostat signal. When thyroid hormone runs low, the pituitary makes more TSH to push the thyroid harder, so TSH goes up. When thyroid hormone is too high, TSH drops. TSH can show that something is off, but other thyroid tests are needed to find the cause."], "y": ["Gaurav's TSH was 2.93 µIU/mL in Dec 2025 in Hyderabad.", "The lab range is 0.27–4.20, so it was normal.", "His free T3 was just below its range on that same Dec 2025 test (2.58).", "If the thyroid gland itself were underactive, TSH would usually be high, so a normal TSH makes that less likely.", "TSH is less reliable when the problem is in the pituitary gland, because the pituitary is the gland that makes TSH. So a normal TSH does not rule out a pituitary cause.", "Free T4, the main hormone the thyroid makes, was not tested. Whether to test it is a question for the doctor.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, his TSH was 2.73 (range 0.45–4.5), also normal."]}, "HbA1c": {"w": ["HbA1c, also called A1C, measures how much sugar is stuck to hemoglobin, the oxygen carrier inside red blood cells. It is shown as a percent.", "Sugar stays stuck for as long as a red blood cell lives, which is about three months. So HbA1c shows the average blood sugar over the past two to three months, not just one day. Below 5.7% is normal, 5.7% to 6.4% is prediabetes, and 6.5% or higher is diabetes. Conditions that affect red blood cells, such as anemia, can make the result less accurate."], "y": ["Gaurav's HbA1c was 5.1% in Dec 2025 in Hyderabad.", "Normal is under 5.7%, so his was normal.", "His fasting glucose on that same Dec 2025 test (89) agreed with this.", "The American Diabetes Association uses a lower body mass index (BMI) line for Asian Americans, 23 instead of 25, because many develop diabetes at a lower weight. Above that line, it advises a diabetes test for adults who also have at least one other risk factor.", "Gaurav's BMI was 24.27 on Nov 18, 2026. HbA1c was not part of the Nov 23, 2026 tests; his fasting glucose that day was 95, normal.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, his HbA1c was 5.2% (normal 4.8–5.6), also normal."]}, "Fasting glucose": {"w": ["Fasting glucose is the amount of sugar in the blood after not eating overnight. Sugar from food is the body's main fuel.", "Doctors use it to screen for diabetes. For a fasting sample, 70–99 mg/dL is normal, 100–125 is prediabetes, and 126 or higher usually means diabetes. These cut-offs only work when the person has not eaten before the test."], "y": ["Gaurav's fasting glucose was 89 mg/dL in Dec 2025 in Hyderabad.", "The lab range is 70–100, so it was normal.", "His HbA1c on that Dec 2025 test (5.1%) also showed normal blood sugar over the months before.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, his glucose was 78 mg/dL (range 70–99), normal. The report does not say whether he had fasted.", "On Nov 23, 2026 at UW Health (fasting): 95 mg/dL, normal."]}, "Fasting insulin": {"w": ["Insulin is a hormone made by the pancreas. It helps sugar move from the blood into cells, where it is used for energy.", "In insulin resistance, the body does not respond to insulin as well as it should. The pancreas makes extra insulin to keep blood sugar normal, so insulin can be high while sugar still looks fine. Over time this can lead to prediabetes and type 2 diabetes. Ranges differ between labs, and hard exercise in the hours before the test can lower the reading for a while."], "y": ["Gaurav's fasting insulin was 9.03 mU/L in Dec 2025.", "The lab range is 2.6–24.9, so it was normal.", "Doctors sometimes combine fasting insulin and fasting glucose into a score called HOMA-IR (homeostatic model assessment of insulin resistance). For Gaurav it works out to about 2.0.", "There is no single agreed cut-off. One review says US doctors and researchers often use about 2.0 to 3.0. It also says studies in Chinese and Korean adults found lower cut-offs, from 1.4 to 2.5, for blood sugar problems and for metabolic syndrome, a group of heart and blood sugar risk factors.", "So his score sits on the border. None of the studies the review names were in people from India, so how to read it is a question for the doctor.", "His SHBG was also a little low (29.9), and low SHBG is linked to insulin resistance, so these results are best read together."]}, "Insulin after a meal": {"w": ["This test measures insulin in a blood sample taken after a meal. Eating makes the pancreas release insulin to move sugar from the blood into cells, so the level is higher than when fasting.", "The number depends on what was eaten and how long before the blood draw. Ranges also differ between labs and test methods. So it is best read next to fasting insulin and blood sugar, not on its own."], "y": ["Gaurav's insulin after a meal was 32.8 mIU/mL in Dec 2025.", "The lab range is 12–82, so it was normal, in the lower half of the range.", "His fasting insulin (9.03) and fasting glucose (89) were also normal.", "His record does not say what he ate or exactly how long after the meal the sample was taken, and both affect this number."]}, "Ferritin": {"w": ["Ferritin is the body's main iron storage protein. It holds iron safely inside cells until the body needs it. The small amount in the blood gives an indirect measure of how much iron is stored.", "Ferritin is like a savings account for iron. A low ferritin is the main blood sign of an iron shortage, and the American Gastroenterological Association, a group of digestive disease doctors, uses under 45 ng/mL to diagnose it in people with anemia. Ferritin can also rise with inflammation, infection or liver disease, so a normal level does not always mean the stores are full."], "y": ["Gaurav's ferritin was 97.8 ng/mL in Dec 2025.", "The lab range is 30–400, so it was normal.", "It was also well above 45, the cut-off the American Gastroenterological Association uses for iron shortage in people with anemia. His hemoglobin was normal, and the guideline says the cut-off for people without anemia is less certain.", "Inflammation can push ferritin up. His ESR, a general sign of inflammation, was low at 2. His hsCRP, another inflammation test, was 1.46, a little above the lab's range of 0–1.", "He started iron 65 mg every other day on Nov 18, 2026. His last ferritin, from Dec 2025, was normal.", "Whether to keep taking it is a question for the doctor."]}, "Transferrin saturation": {"w": ["Transferrin is a protein that carries iron through the blood, like a fleet of delivery trucks. Transferrin saturation shows what percent of those trucks are carrying iron.", "It is worked out from two other numbers: serum iron divided by total iron-binding capacity (TIBC), times 100. A low percent can mean iron shortage, poor absorption or long-term inflammation. A high percent can mean iron overload or a liver problem."], "y": ["Gaurav's transferrin saturation was 19.3% in Dec 2025.", "His lab range is 15–50, so it was normal but near the bottom.", "Cleveland Clinic gives 20% to 50% as the usual range, and by that range it would be just below.", "Because this number is worked out from serum iron, his low serum iron that day (58) pulled it down.", "His ferritin, which shows the iron stores, was normal at 97.8."]}, "Hemoglobin": {"w": ["Hemoglobin is an iron-rich protein inside red blood cells. It carries oxygen from the lungs to the rest of the body.", "A low hemoglobin can be a sign of anemia, which can come from low iron, low vitamin B12, blood loss and other illnesses. A high hemoglobin can come from lung disease, heart disease, sleep apnea or a bone marrow condition. Dehydration, smoking and living at high altitude can also change the result."], "y": ["Gaurav's hemoglobin was 15.6 g/dL in Mar 2023 and 14.2 g/dL in Dec 2025 in Hyderabad.", "That lab's range is 13–17, so both were normal.", "The Dec 2025 result was 1.4 lower than in 2023 but still in range.", "On the Dec 2025 test, his hematocrit was a little low (38.9%) and his MCHC (mean corpuscular hemoglobin concentration) was high.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, his hemoglobin was 14.5 g/dL (range 13.0–17.7), normal, with a normal hematocrit and MCHC on the same test. So it was normal on all three tests."]}, "Platelets": {"w": ["Platelets are tiny pieces in the blood that help it clot. They are smaller than red or white blood cells.", "A normal count is about 150,000 to 400,000 per microliter of blood. Too few can lead to bleeding, and below 50,000 even everyday activities can cause bleeding. Too many can come from low iron, a recent infection or a bone marrow disease, and very high counts can lead to clots."], "y": ["Gaurav's platelets were 2.51 lakhs/cumm in Mar 2023 and 2.19 lakhs/cumm in Dec 2025 in Hyderabad.", "Indian labs write the count in lakhs per cubic millimeter. One lakh is 100,000, so these are 251,000 and 219,000 per microliter, the way US labs report it.", "The Hyderabad range is 1.5–4.0 lakhs (150,000–400,000), so both were normal.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, his platelets were 234,000 per microliter (2.34 lakhs; range 150,000–450,000), also normal."]}, "ESR": {"w": ["ESR stands for erythrocyte sedimentation rate, also called the sed rate. Blood is put in a tall, thin tube, and the lab measures how many millimeters the red blood cells sink in one hour.", "Inflammation makes red blood cells stick together in clumps. Clumps are heavier, so they sink faster and the ESR goes up. ESR can show that inflammation is present, but not what is causing it. A person can have an inflammatory illness and still have a normal ESR, so it is often checked with CRP (C-reactive protein)."], "y": ["Gaurav's ESR was 2 mm/hr in both Mar 2023 and Dec 2025.", "The lab range is 0–10, so both were normal and low.", "MedlinePlus lists under 15 as normal for men under 50.", "His hsCRP (high-sensitivity C-reactive protein), another inflammation test, was 1.46 in Dec 2025, which heart groups call average risk."]}, "Total cholesterol": {"w": ["Total cholesterol is all the cholesterol in the blood added together. It includes LDL (low-density lipoprotein), the 'bad' kind, and HDL (high-density lipoprotein), the 'good' kind.", "Because it mixes good and bad together, the total alone does not tell the whole story. For adults, under 200 mg/dL is the healthy target. Taking HDL away from the total gives non-HDL cholesterol, which counts the harmful kinds together. For adults, under 130 is the healthy target for non-HDL."], "y": ["Gaurav's total cholesterol was 219 mg/dL at a US lab (Labcorp) on Nov 24, 2025, above the range of 100–199.", "It was 181 mg/dL in Dec 2025 in Hyderabad, inside the range.", "On the standard US scale, 200–239 is borderline high.", "Most of the difference between the two tests came from LDL (148 vs 117).", "On Nov 23, 2026 at UW Health (fasting): 229 mg/dL, borderline high (200–239), the highest of his three tests."]}, "HDL cholesterol": {"w": ["HDL stands for high-density lipoprotein. It is called the 'good' cholesterol because it helps carry cholesterol away from the arteries.", "A higher HDL may help lower the risk of heart attack and stroke. For men, below 40 mg/dL is low, and 60 or higher is best. Smoking lowers HDL."], "y": ["Gaurav's HDL was 51 mg/dL in Dec 2025 in Hyderabad.", "The lab goal is 40 or more, so it was in range, between the low line of 40 and the best level of 60.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, his HDL was also 51 mg/dL (normal above 39).", "On Nov 23, 2026 at UW Health (fasting): 55 mg/dL, normal and a little higher than before (51)."]}, "Triglycerides": {"w": ["Triglycerides are a type of fat in the blood. When a person eats more calories than the body needs right away, the body turns the extra into triglycerides and stores them in fat cells for later energy.", "Under 150 mg/dL is healthy, 150–199 is borderline high, 200–499 is high, and 500 or more is very high. High levels can raise the risk of heart disease and stroke. Very high levels can cause sudden pancreatitis, which is inflammation of the pancreas. Some doctors ask for 9 to 12 hours of fasting before the test."], "y": ["Gaurav's triglycerides were 66 mg/dL in Dec 2025 in Hyderabad.", "The target is under 150, so his were well within the healthy range.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, his triglycerides were 111 mg/dL (range 0–149), also normal.", "On Nov 23, 2026 at UW Health (fasting): 68 mg/dL, normal."]}, "NT-proBNP": {"w": ["NT-proBNP stands for N-terminal pro-B-type natriuretic peptide. The heart releases it, along with a related hormone called BNP, when it has to work harder than normal to pump blood.", "When the heart is stretched or strained, these levels go up. Doctors use the test mainly to check for heart failure, which means the heart is not pumping as well as the body needs. A normal result usually means heart failure is unlikely. Kidney disease can raise the level, and obesity can lower it."], "y": ["Gaurav's NT-proBNP was 53.5 pg/mL in Dec 2025.", "The lab limit is 125, so it was normal, under half the limit.", "A 2016 European heart guideline also used 125 as the line for a raised level in people seen outside the hospital.", "His echocardiogram, a heart ultrasound done the same day, was normal too, with pumping strength of 65%.", "This test looks for heart strain, not for narrowed heart arteries, so it does not answer the question raised by his borderline treadmill test."]}, "Troponin I": {"w": ["Troponin is a protein found in heart muscle cells. Normally, very little of it is in the blood. When heart muscle is damaged, troponin leaks out and the blood level rises.", "Doctors use the test mainly to find out whether someone is having or recently had a heart attack. Other things can raise it too, including long, intense exercise such as running a marathon, kidney disease, and some other heart and lung conditions."], "y": ["Gaurav's troponin I was below 2.50 pg/mL in Dec 2025, which means it was too low for the test to measure.", "The lab limit is 58, so it was far below the limit.", "This shows no sign of heart muscle damage at the time of the test.", "Troponin shows damage, not narrowing. It does not show whether blood flow to the heart drops during exercise, which is the question his borderline treadmill test raised."]}, "ALT (liver)": {"w": ["ALT stands for alanine transaminase. It is an enzyme, a protein that speeds up chemical reactions, and it is found mainly in the liver.", "When liver cells are hurt, they release ALT into the blood, so a high level can be a sign of liver injury. Causes include hepatitis, some medicines and other liver diseases. Intense exercise, weight and some supplements can also change the result, so one high reading does not always mean a problem."], "y": ["Gaurav's ALT was 26 IU/L in Mar 2023 and 13 IU/L in Dec 2025 in Hyderabad.", "That lab's range is 0–40, so both were normal.", "His AST, the other liver enzyme, was normal on all three tests.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, his ALT was 24 IU/L (range 0–50), also normal.", "On Nov 23, 2026 at UW Health (fasting): 23 U/L, normal (UW range 0–55)."]}, "AST (liver)": {"w": ["AST stands for aspartate aminotransferase. It is an enzyme found mostly in the liver, with smaller amounts in the heart, muscles and other parts of the body.", "When these cells are damaged, they release AST into the blood. Because AST comes from muscle as well as liver, doctors usually read it together with ALT, which comes mainly from the liver. Exercise, some medicines and alcohol can also affect the result."], "y": ["Gaurav's AST was 27 IU/L in Mar 2023 and 18 IU/L in Dec 2025 in Hyderabad.", "That lab's range is 0–42, so both were normal.", "In one study, an hour of weightlifting raised AST and ALT in healthy men who did not usually lift weights, and the rise lasted at least seven days.", "His WHOOP fitness tracker shows that Gaurav runs and lifts weights often. The men in that study were not used to weightlifting, so it is not known how much a workout would change his numbers. His AST was normal (29) on Nov 23, 2026.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, his AST was 33 IU/L (range 15–59), also normal.", "On Nov 23, 2026 at UW Health (fasting): 29 U/L, normal (UW range 6–43)."]}, "Creatinine (kidney)": {"w": ["Creatinine is a waste product. It forms when the body breaks down creatine, a chemical that gives muscles energy. The kidneys filter creatinine out of the blood and into the urine.", "When the kidneys are not working well, less creatinine leaves in the urine, so it builds up in the blood. The level also depends on body size and muscle mass. Dehydration and muscle breakdown can also raise it."], "y": ["Gaurav's creatinine was 0.87 mg/dL in Dec 2025 in Hyderabad.", "That lab's range is 0.67–1.17, so it was normal, near the middle.", "MedlinePlus lists about 0.7 to 1.3 as normal for men.", "At a US lab (Labcorp, ordered by Dr. Banter) on Nov 24, 2025, his creatinine was 1.06 mg/dL (range 0.76–1.27), also normal, with an eGFR of 97.", "On Nov 23, 2026 at UW Health (fasting): 1.14 mg/dL, normal (UW range 0.73–1.18). It was 1.06 in Nov 2025 and 0.87 in Dec 2025."]}, "H. pylori antibody": {"w": ["H. pylori is short for Helicobacter pylori. It is a common germ that can live in the lining of the stomach. Most people who carry it never have symptoms. It can cause stomach irritation (gastritis) and ulcers, and without treatment it can raise the chance of stomach cancer.", "The antibody test is a blood test that looks for the body's defense proteins against the germ. A positive result cannot tell a current infection from an old one, because antibodies can stay for years after a cure. For that reason, breath and stool tests are used more often."], "y": ["Gaurav's H. pylori antibody test was negative in Dec 2025.", "A negative result means he probably does not have an H. pylori infection.", "The germ is common in India. One review says about 80% of people there are infected by adulthood, but that figure comes from a study published in 1994.", "A US guideline on low iron from the American Gastroenterological Association says that in people with anemia, treating H. pylori helps iron pills work better. His negative result makes this germ an unlikely reason for his one low serum iron reading."]}, "White blood cells": {"w": ["White blood cells fight infection. A blood count adds up all the types together: neutrophils, lymphocytes, monocytes and others.", "The total is like the size of an army. A very low total can make infections easier to catch, and a high total often means the body is fighting something."], "y": ["Gaurav's white cell count was 6,320 in Mar 2023, 5,200 in Nov 2025 and 4,660 in Dec 2025 (per microliter).", "All three were normal (US lab range 3,400–10,800).", "A normal total makes a blood cell disorder less likely as the reason for his high lymphocyte share."]}, "Lymphocytes, actual count": {"w": ["This is the actual number of lymphocytes in a microliter of blood, not their share of all white cells.", "Doctors use the actual number to decide if lymphocytes are truly high. The share alone can look high just function parseRange(r){
