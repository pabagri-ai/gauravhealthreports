", "Clearing up IGF-1 and cortisol together helps rule out a pituitary problem before trying to conceive."]}, "Free T3": {"c": ["pit", "abs"], "k": "t3", "why": "Free T3 was just below range while TSH was normal. This pattern usually reflects how the body was turning T4 into T3 at that moment, often because of eating less, illness or stress, rather than a thyroid disease.", "causes": ["Eating fewer calories or fasting", "A recent illness or inflammation", "Physical stress", "Lab-to-lab differences in range", "Rarely, a pituitary problem"], "recheck": ["Repeat TSH, free T4 and free T3 at a US lab when he is well and eating normally", "A look at recent diet and weight changes"], "preg": ["Taking thyroid hormone is not recommended for this pattern on its own.", "A normal repeat removes one open question before trying to conceive."]}, "Folate (red cell)": {"c": ["abs", "sperm"], "why": "Red cell folate was just under the MedPlus range but inside some US ranges. It is a borderline result, and worth a recheck because folate is needed to make sperm.", "causes": ["Low intake of leafy greens, beans, lentils and fortified grains", "Alcohol", "Smoking", "Poor absorption, such as celiac disease", "Lab range differences"], "recheck": ["Repeat red cell folate at a US lab", "Vitamin B12 and methylmalonic acid (MMA) at the same time", "Homocysteine", "Celiac blood test (tTG-IgA) if folate, iron and protein all stay low"], "preg": ["Folate helps copy DNA, and studies link folate in men with sperm quality, though the results are mixed.", "A large trial (FAZST) found that high-dose folic acid (5 mg) with zinc did not improve semen quality or birth rates, and men taking it had more sperm DNA damage, so more is not better.", "Food first, with any supplement dose agreed with his doctor, is the safer path.", "B12 should be checked first, because doctors treat a B12 shortage before giving folic acid.", "Sperm take roughly 2 to 3 months to form, so changes made now show up in sperm a few months later."]}, "Iron": {"c": ["abs"], "why": "Serum iron was low on the day of the test, but ferritin and transferrin saturation were normal. This looks like a day-to-day dip rather than an iron shortage.", "causes": ["Normal swings with time of day and meals", "A recent infection or inflammation, which holds iron back from the blood for a while", "Low iron in the diet", "Poor absorption, such as celiac disease"], "recheck": ["Repeat iron panel with ferritin and transferrin saturation, fasting, in the morning", "Full blood count", "Celiac blood test if iron, folate and protein all stay low"], "preg": ["Gaurav's iron stores look normal, so iron pills are not clearly needed.", "A recheck before any supplement avoids treating a number that may already be fine."]}, "Magnesium": {"c": ["abs"], "why": "Magnesium was just under range. It is a mild finding, but it can come with low potassium or low calcium, and it is easy to recheck.", "causes": ["Low intake", "Loose stools or poor absorption", "Alcohol", "Long-term acid-reducing pills (proton pump inhibitors) or water pills (diuretics)"], "recheck": ["Repeat magnesium with potassium and calcium", "A review of medicines, especially acid reducers"], "preg": ["This is a general health item more than a fertility item.", "Finding the cause still matters, since magnesium keeps muscles, nerves and heart rhythm steady."]}, "Hematocrit": {"c": ["abs"], "why": "Hematocrit was a little low in Dec 2025 while hemoglobin stayed normal. Together with the high MCHC on the same test, this may be a machine reading effect rather than true anemia.", "causes": ["Lab or sample effect, such as red cells clumping or cloudy blood", "A real small drop in red cells. This is less likely, because his hemoglobin was normal, and low iron usually makes MCHC go down, not up."], "recheck": ["Repeat full blood count at a US lab, including MCV (red cell size)", "Blood smear review", "Iron panel and folate"], "preg": ["Gaurav's normal hemoglobin suggests his blood carries oxygen well.", "If the repeat shows unusual red cells, the couple's genetic carrier screening can also look for inherited blood traits such as thalassemia."]}, "MCHC": {"c": ["abs"], "why": "MCHC was high on both tests. High MCHC is often a lab effect, but sometimes it points to a red cell condition such as hereditary spherocytosis, so it deserves one careful repeat.", "causes": ["Red cells clumping in a cold sample (cold agglutinins)", "Cloudy blood from fat or broken red cells interfering with the reading", "A hematocrit reading that is too low, since MCHC is worked out from it", "Hereditary spherocytosis, an inherited condition with round, fragile red cells", "Very dilute blood, such as low blood sodium"], "recheck": ["Repeat full blood count at a US lab, telling the lab about the past high MCHC", "Blood smear looked at under a microscope", "Further testing for hereditary spherocytosis only if the smear suggests it"], "preg": ["Hereditary spherocytosis is inherited, so if it were found, a child could inherit it, and that is useful to know before pregnancy.", "High MCHC often turns out to be a lab effect, and one careful repeat can show that."]}, "Lymphocytes": {"c": ["vir"], "k": "lymphocyte", "why": "The lymphocyte percent was high on two tests more than two years apart. Without the actual count, it is not clear whether there are truly too many lymphocytes.", "causes": ["A recent or lingering viral infection, such as Epstein-Barr virus (mono) or cytomegalovirus", "A low count of other white cells, which makes the lymphocyte share look bigger", "Physical stress", "Other infections, including TB", "Rarely, a blood disorder; the most common one in adults is usually found around age 70"], "recheck": ["Full blood count with the actual (absolute) lymphocyte count", "Blood smear", "HIV, hepatitis B and hepatitis C tests", "Flow cytometry, a test that sorts blood cells, only if the count stays high for more than a month without a clear cause"], "preg": ["Fertility doctors advise HIV, hepatitis B and hepatitis C screening for both partners, so these tests serve both purposes.", "A moderate or high fever can lower sperm count and movement for up to about 3 months, so a semen analysis is best timed away from a recent feverish illness."]}, "APTT (clotting time)": {"c": ["clot"], "why": "APTT was less than one second over the top of the range, once, in 2023. It is a small change that can come from how the sample was handled, but it was never repeated.", "causes": ["Sample handling, such as an under-filled tube", "Lupus anticoagulant, an antibody that lengthens the lab test but is linked to clots rather than bleeding", "A mild shortage of a clotting protein (factor 8, 9, 11 or 12); a factor 12 shortage does not cause bleeding", "Von Willebrand disease, the most common inherited bleeding disorder"], "recheck": ["Repeat APTT and PT (prothrombin time) from a clean arm-vein draw", "Mixing study if APTT is still long", "Clotting factor tests, von Willebrand tests or a lupus anticoagulant test, as the doctor decides", "A note of any easy bruising, nosebleeds or long bleeding after dental work"], "preg": ["This finding is about bleeding and clotting, not sperm.", "It matters before any procedure on Gaurav, such as a sperm retrieval, where bleeding risk counts.", "If a factor 8 or 9 shortage (hemophilia) were ever found, all of his daughters would carry the gene, because a father passes his X chromosome to every daughter."]}, "LDL cholesterol": {"c": ["heart", "lpa"], "why": "LDL was 117, above the report's goal of under 100. On its own this is mild. But the 2026 US cholesterol guideline says high Lp(a) is a reason to lower LDL more, and the borderline stress test adds to the reason to look closely.", "causes": ["Diet high in saturated fat", "Family genes", "Low physical activity"], "recheck": ["Fasting lipid panel at a US lab", "ApoB (apolipoprotein B), which counts all the particles that can clog arteries", "Blood pressure check", "A heart risk estimate with the PREVENT calculator, which can give a 30-year risk from age 30"], "preg": ["Lowering LDL with food changes and exercise is a safe first step while trying to conceive.", "Research on statins and sperm is mixed, with some studies showing changes and others not, so if a statin is suggested, Gaurav can ask the doctor about timing.", "European experts estimate that about 21 mg/dL lower LDL over a lifetime can offset the extra risk from about 50 mg/dL more Lp(a)."]}, "Lipoprotein(a)": {"c": ["lpa", "heart"], "k": "lipoprotein", "why": "Lp(a) was 112.4, almost four times the lab's limit of 30. It is inherited and raises the lifetime risk of narrowed arteries, heart attack, stroke and a stiff aortic valve.", "causes": ["Inherited genes, which set more than 90% of the level", "Diet and lifestyle have very little effect on it"], "recheck": ["No need to repeat often, since it stays about the same for life", "Keep LDL, blood pressure and blood sugar well controlled", "Cardiologist review together with the stress test follow-up", "Testing of first-degree relatives (parents and siblings)"], "preg": ["A child has about a 50% chance of inheriting high Lp(a) from a parent who has it.", "Testing first-degree relatives is recommended, so the child's doctor can be told and the child can be tested later.", "No drug made to lower Lp(a) is approved yet. In Sep 2026, a large trial of one such drug (pelacarsen), in people who already had heart disease, reported that it did not meet its main goal of cutting heart attacks, strokes and heart deaths. Other drugs are still being tested.", "The plan for now is to keep every other heart risk low."]}, "hsCRP": {"c": ["heart", "vir"], "why": "hsCRP was 1.46, in the average-risk group. Alongside high Lp(a) it adds a little to the heart picture, but one result is not enough to judge.", "causes": ["Low-level inflammation in the arteries", "A recent cold, infection or injury", "Other ongoing inflammation in the body"], "recheck": ["Repeat hsCRP twice, about two weeks apart, when he has been well", "Read it together with Lp(a), LDL and the stress test follow-up"], "preg": ["No fertility step is needed for this number by itself.", "If the raised value came from an illness with fever, that same illness can lower sperm quality for up to about 3 months."]}, "Total protein": {"c": ["abs"], "k": "protein", "why": "Total protein was a little under the MedPlus range but inside some US ranges. Without albumin and globulin shown, it is hard to tell which part is low.", "causes": ["Low protein intake", "Poor absorption, such as celiac disease", "Protein loss through the kidneys", "Liver problems (his liver enzymes were normal)", "Lab range differences"], "recheck": ["Repeat with albumin and globulin (comprehensive metabolic panel)", "Urine test for protein", "Celiac blood test if folate, iron and protein all stay low"], "preg": ["Several nutrients that matter for sperm (folate, zinc, B12) were also near the low edge, so a low protein result is a reason to look at overall nutrition before trying to conceive.", "A clear albumin result also helps the doctor read zinc and cortisol correctly."]}, "Urine sodium": {"c": ["salt", "heart", "adr"], "k": "sodium", "why": "One urine sodium of 200 was above the lab range. It most often reflects a salty diet, but a single spot sample is a weak guide to daily salt intake.", "causes": ["Salty food in the meals before the test", "Water pills (diuretics) or some other medicines", "Low adrenal gland function", "Kidneys losing salt"], "recheck": ["Blood pressure in clinic and at home", "Blood sodium and potassium", "24-hour urine sodium if an accurate salt count is needed", "Renin and aldosterone if morning cortisol stays low"], "preg": ["The American Heart Association advises no more than 2,300 mg of sodium a day, about one teaspoon of salt, and ideally 1,500 mg.", "Less salt in household cooking helps blood pressure, which matters more with Gaurav's high Lp(a)."]}, "Testosterone, total": {"c": ["sperm"], "k": "testosterone", "why": "Total testosterone was normal at 375, and LH and FSH, the hormones that drive sperm making, were normal too.", "causes": ["Normal result, so there is no cause to look for"], "recheck": ["No repeat needed unless symptoms appear", "If it is ever rechecked, draw it between 7 and 11 a.m."], "preg": ["Testosterone pills, gels or shots should be avoided while trying to conceive, because they switch off the signals for sperm making.", "Normal hormones do not show sperm count or movement, so a semen analysis is still needed."]}, "Vitamin D": {"c": ["sperm", "abs"], "why": "Vitamin D was normal but near the bottom of the lab range. Expert groups do not agree on one target, so this is not a clear shortage.", "causes": ["Little time in the sun", "Low intake of foods with vitamin D"], "recheck": ["The Endocrine Society does not advise routine retesting for healthy adults under 75", "A standard daily amount from food or a basic supplement, as his doctor advises"], "preg": ["A trial of 330 men with fertility problems and low vitamin D found that high-dose vitamin D did not improve semen quality overall.", "A standard daily amount is reasonable for general health, but high doses are not a proven fertility fix."]}, "Vitamin B12": {"c": ["abs", "sperm"], "why": "B12 was normal but in the lower part of the range. A low-normal B12 can still hide a mild shortage, and B12 matters for using folate and for sperm.", "causes": ["Eating little or no meat, fish, eggs or dairy", "Long-term acid-reducing medicines or metformin", "Poor absorption from the stomach or gut"], "recheck": ["Repeat B12 with methylmalonic acid (MMA)", "Homocysteine and folate at the same time"], "preg": ["A review links B12 to better sperm count and movement and less sperm DNA damage, though more clinical studies are needed.", "If a shortage is found, doctors treat it before starting folic acid."]}, "Zinc": {"c": ["sperm", "abs"], "why": "Zinc was normal but near the bottom of the range. Blood zinc moves with meals, time of day, illness and blood protein, so this is not a clear shortage.", "causes": ["Low zinc intake", "Eating before the blood draw (his blood was drawn at 8:00 a.m., so a late-day dip does not explain it)", "Slightly low blood protein lowering the reading", "A recent illness"], "recheck": ["Repeat zinc, fasting, early in the morning", "Albumin at the same time"], "preg": ["Men with fertility problems tend to have less zinc in semen, and some studies showed better sperm movement with zinc.", "But the large FAZST trial found zinc plus folic acid did not improve semen quality or live births, so a high-dose zinc supplement is not a proven fix."]}, "Homocysteine": {"c": ["heart", "abs"], "why": "Homocysteine was normal but in the upper part of the range, which fits with Gaurav's slightly low folate and low-normal B12.", "causes": ["Low folate, B12 or B6", "Alcohol", "Smoking", "Low thyroid", "Rare inherited conditions"], "recheck": ["Repeat homocysteine with folate, B12 and methylmalonic acid (MMA)"], "preg": ["High homocysteine in men has been linked to sperm DNA damage, though the research is still limited.", "Checking folate and B12 together shows whether a vitamin fix is needed."]}};
const COND = {"heart": {"what": "The heart muscle gets its blood from small arteries on its surface, called coronary arteries. Cholesterol can build up in their walls over many years and narrow them. A narrowed artery may carry enough blood at rest but not during hard exercise. A treadmill stress test looks for signs of that on the heart tracing (ECG) during exercise. The treadmill test can give false alarms. In a large review, it missed about 1 in 3 people with narrowing and flagged about 1 in 4 people without it.", "hist": ["Treadmill stress test, Dec 5, 2025: borderline for reduced blood flow to the heart during exercise", "Lp(a) 112.4 mg/dL (limit 30), Dec 2025", "LDL 117 mg/dL (goal under 100), Dec 2025", "hsCRP 1.46 mg/L (lab range 0–1), Dec 2025", "Urine sodium 200 mmol/L (range 25–145), Dec 2025", "Reassuring, Dec 2025: echocardiogram normal with pumping strength 65%; troponin I under 2.50 and NT-proBNP 53.5, both normal; ECG normal rhythm with a breathing-related heart-rate change"], "tests": ["Cardiologist review of the Dec 2025 treadmill tracing", "Coronary CT angiography (a CT scan of the heart arteries), which guidelines favor for people under 65", "Or a stress echocardiogram (heart ultrasound during exercise)", "Fasting lipid panel and ApoB", "Blood pressure check"], "preg": ["A clear answer before trying to conceive lets the doctor say how hard Gaurav can safely exercise.", "If medicine is suggested, the doctor can talk through timing, since studies of statins and sperm are mixed."]}, "lpa": {"what": "Lp(a) is a cholesterol particle with an extra sticky protein. The level is set mostly by genes and stays about the same for life. High Lp(a) adds to the risk of narrowed arteries, heart attack, stroke and a stiff aortic valve. Diet and exercise barely change it. No drug made to lower it is approved yet, so the plan is to keep every other risk low.", "hist": ["Lp(a) 112.4 mg/dL in Dec 2025 (lab limit 30)", "LDL 117 mg/dL in Dec 2025", "Borderline treadmill stress test, Dec 5, 2025"], "tests": ["One Lp(a) test is usually enough for life", "A US repeat is optional, to have it on record locally", "Testing of his parents and siblings", "Heart risk review with a cardiologist"], "preg": ["A child has about a 50% chance of inheriting high Lp(a) from a parent who has it.", "Knowing this now means the child's doctor can be told, and the child can be tested later."]}, "adr": {"what": "The adrenal glands sit on top of the kidneys and make cortisol. If they make too little, a person may have low blood pressure, dizziness, belly pain or darker skin. During a sudden illness, the body may not make enough cortisol to cope, which can lead to an emergency called an adrenal crisis. In India, tuberculosis is a known cause of adrenal gland damage. One morning test cannot confirm this. A stimulation test, where the doctor gives a shot of ACTH and checks whether cortisol rises, settles it.", "hist": ["Cortisol 3.70 µg/dL at 8:00 a.m. in Dec 2025 (expected about 6–18)", "DHEA-S 316 µg/dL in Dec 2025, normal (80–560), which is reassuring", "Urine sodium 200 mmol/L in Dec 2025; low adrenal function is one of several things that can raise it", "Grew up in India, and the Mar 2023 chest CT showed scarring", "WHOOP: the Dec 2025 cortisol was drawn 4–5 days after a 13½-hour time change, so jet lag may explain the low value"], "tests": ["Repeat 8:00 a.m. cortisol with ACTH", "ACTH (cosyntropin) stimulation test", "Blood sodium, potassium, renin and aldosterone", "A review of any steroid creams, inhalers or injections in the past year", "IGRA blood test for TB (QuantiFERON), which doctors also use when looking for a cause"], "preg": ["Untreated low cortisol can turn an ordinary illness into an emergency, so it is best settled before pregnancy and a newborn's first months.", "If Gaurav needs latent TB treatment, the drug rifampin speeds up cortisol breakdown and has triggered adrenal crisis in people with adrenal insufficiency, so the order of testing and treatment matters."]}, "pit": {"what": "The pituitary is a pea-sized gland under the brain. It sends signals to the adrenal glands (ACTH), the thyroid (TSH), the testes (LH and FSH) and the liver (growth hormone, which leads to IGF-1). If the pituitary underworks, more than one of these signals can drop. For example, low thyroid or low growth hormone can come along with low cortisol from a pituitary cause.", "hist": ["Cortisol 3.70 µg/dL at 8:00 a.m., Dec 2025 (low)", "IGF-1 107 ng/mL, Dec 2025, flagged low against a range that matches 14-year-old boys", "Free T3 2.58 pg/mL, Dec 2025, just below 2.66", "Against this, in Dec 2025: TSH 2.93, LH 5.71, FSH 3.24, prolactin 7.61 and testosterone 375 were all normal", "WHOOP: the Dec 2025 cortisol was drawn 4–5 days after a 13½-hour time change, so jet lag may explain the low value"], "tests": ["Repeat morning cortisol with ACTH (low ACTH with low cortisol points to the pituitary)", "Repeat IGF-1 at a US lab with adult age-based ranges", "Free T4 with TSH", "Brain imaging of the pituitary only if a pituitary cause is confirmed"], "preg": ["The pituitary drives sperm making through LH and FSH, and both were normal in Dec 2025, which is reassuring.", "A semen analysis shows directly whether sperm making is on track."]}, "ir": {"what": "Insulin is the hormone that moves sugar from the blood into cells. In insulin resistance, cells respond less, so the body makes more insulin to keep blood sugar normal. Blood sugar can stay normal for years while this builds. Low SHBG is closely linked to insulin resistance and to a higher future risk of type 2 diabetes. US diabetes guidelines advise testing Asian Americans at a lower BMI (body mass index) of 23 when they have at least one other risk factor, because type 2 diabetes tends to appear at a lower body weight.", "hist": ["SHBG 29.9 nmol/L in Dec 2025, below 32.4–128", "Fasting glucose 89 mg/dL and HbA1c 5.1% in Dec 2025, both normal", "Fasting insulin 9.03 and after-meal insulin 32.8 in Dec 2025, both inside the lab ranges"], "tests": ["Repeat SHBG", "Fasting glucose, fasting insulin and HbA1c; doctors can combine glucose and insulin into an insulin resistance score called HOMA-IR", "Waist size, weight and blood pressure", "Liver tests or a liver ultrasound for fatty liver if the doctor suspects it"], "preg": ["Metabolic syndrome, which includes insulin resistance, is linked in studies to lower sperm count, poorer movement and more sperm DNA damage.", "Sperm take roughly 2 to 3 months to form, so a semen analysis reflects health over the past few months."]}, "abs": {"what": "Several nutrients were low or near the low edge at the same time. This can happen when the diet is short on them, or when the gut does not absorb them well. Celiac disease is one gut cause. In celiac disease, gluten from wheat, barley and rye harms the lining of the small intestine, so it absorbs less iron, folate and other nutrients. A blood test can screen for it, but only while the person is still eating gluten.", "hist": ["Iron 58 µg/dL (range 70–180), Dec 2025, with normal ferritin 97.8", "Red cell folate 500.9 ng/mL (MedPlus range 523–1257), Dec 2025", "Magnesium 1.7 mg/dL (range 1.8–2.6), Dec 2025", "Total protein 6.4 g/dL (range 6.6–8.3), Dec 2025", "Hematocrit 38.9% (range 40–50), Dec 2025", "Near the low edge in Dec 2025: vitamin D 32.1, B12 243, zinc 72.63; homocysteine 11.9 near the top", "IGF-1 (107) and free T3 (2.58) can also drop when food intake is low", "H. pylori antibody negative, Dec 2025"], "tests": ["Celiac blood test (tTG-IgA, with total IgA), done while still eating gluten", "Repeat iron panel, folate, B12 with MMA, magnesium, zinc and albumin at one US lab", "Urine protein test", "A dietitian review of a typical week of meals"], "preg": ["Folate, zinc, B12 and vitamin D all play a part in making sperm, and Gaurav's were low or near the low edge.", "Supplements have not been proven to treat male infertility, and high-dose folic acid with zinc raised sperm DNA damage in one large trial, so finding the cause and eating well come first.", "Older reports found semen problems in men with celiac disease that got better on a gluten-free diet, though there is little newer research. So the celiac test is worth asking about before trying to conceive, especially if folate, iron and protein stay low on a repeat."]}, "lung": {"what": "A chest CT (computed tomography) scan is a detailed X-ray picture of the chest. Widened airways are called bronchiectasis. In India, past TB and other lung infections are the most common causes. The right middle lobe airway is long and narrow, so it is prone to blockage and later widening. Rarely, inherited conditions that affect the tiny hairs lining the airways (primary ciliary dyskinesia) or the cystic fibrosis gene cause both widened airways and male infertility.", "hist": ["Mar 2023 chest CT: minimal scarring and a few slightly widened airways in the right middle lobe", "Mar 2023 chest CT: a few small lymph nodes in the middle of the chest, called non-specific", "Mar 2023 sputum tests: no TB growth after 6 weeks and no cancer cells", "Mar 2023 lung function test: done in Hyderabad, but no result recorded"], "tests": ["Repeat lung function test (spirometry)", "Lung specialist review of the 2023 CT images", "A new CT only if the specialist or symptoms call for it", "IGRA blood test for latent TB"], "preg": ["If a semen analysis showed sperm that do not move, or no sperm, doctors would think about the cilia and cystic fibrosis gene causes, since these can link the lungs and fertility.", "Recommended carrier screening before pregnancy includes the cystic fibrosis gene."]}, "tb": {"what": "Latent TB means TB germs are in the body but asleep. A person with latent TB has no symptoms and cannot spread TB. Without treatment, about 5 to 10 of every 100 people with latent TB develop active TB in their lifetime, and active TB can spread through the air. People born in countries where TB is common are advised to be tested. The IGRA blood test (QuantiFERON) is preferred for people who had the BCG vaccine, because BCG can make the skin test falsely positive but does not affect the blood test. Treatment takes 3 to 4 months and is about 90% effective at preventing TB disease.", "hist": ["Grew up in India", "Mar 2023 chest CT: scarring and slightly widened airways in the right middle lobe, plus small non-specific lymph nodes in the middle of the chest", "Mar 2023 sputum culture: no TB growth after 6 weeks (this checks for active TB, not latent TB)", "No latent TB test on record"], "tests": ["IGRA blood test (QuantiFERON)", "Chest X-ray if the IGRA is positive, to rule out active TB", "A short treatment course (3 or 4 months) if latent TB is confirmed"], "preg": ["Children under 5 are more likely to get sick soon after TB infection, and babies are more likely to get severe forms such as TB meningitis.", "Latent TB cannot spread, but treating it before the baby arrives lowers the chance it wakes up and becomes contagious later in the household.", "The preferred short treatments use rifampin or a related drug, rifapentine, and both speed up cortisol breakdown, so the doctor should know about Gaurav's low morning cortisol first."]}, "vir": {"what": "Some viruses, such as Epstein-Barr virus (the cause of mono) or cytomegalovirus, can raise the number of lymphocytes. Other infections, including early HIV and TB, can raise them too. A blood smear can show lymphocytes that look 'activated', which points to a virus. The actual lymphocyte count, not only the percent, shows whether there is a true excess.", "hist": ["Lymphocytes 44.8% (Mar 2023) and 47.4% (Dec 2025), above the 20–40% range", "hsCRP 1.46 mg/L in Dec 2025", "Small non-specific lymph nodes in the middle of the chest on the Mar 2023 CT", "ESR 2 mm/hr on both tests, normal"], "tests": ["Full blood count with the absolute lymphocyte count and a blood smear", "HIV, hepatitis B and hepatitis C tests", "Other virus tests as the doctor decides", "Flow cytometry only if the count stays high for more than a month without a clear cause"], "preg": ["Fertility doctors advise HIV, hepatitis B and hepatitis C screening for both partners, so these tests serve both purposes.", "A moderate or high fever can lower sperm count and movement for up to about 3 months, so a semen analysis is best timed away from a recent feverish illness."]}, "clot": {"what": "Blood clotting depends on a chain of clotting proteins called factors. If one factor runs low, the lab clotting time gets longer, and the person may bruise or bleed more easily. Some causes lengthen the lab test without causing bleeding, such as a factor 12 shortage. An antibody called lupus anticoagulant also lengthens the test but is linked to clots rather than bleeding. A slightly long result can also come from how the sample was taken or handled.", "hist": ["APTT 34.9 seconds in Mar 2023 (range 25–34), not repeated since", "Platelets normal: 2.51 lakhs/cumm (Mar 2023) and 2.19 (Dec 2025)"], "tests": ["Repeat APTT and PT (prothrombin time)", "Mixing study if APTT is still long", "Clotting factor tests, von Willebrand tests or a lupus anticoagulant test, as the doctor decides", "A personal and family history of bleeding"], "preg": ["This finding is about bleeding and clotting, not sperm.", "It matters before any fertility procedure on Gaurav, such as a sperm retrieval.", "If a factor 8 or 9 shortage (hemophilia) were found, all of his daughters would carry the gene, because a father passes his X chromosome to every daughter."]}, "salt": {"what": "Table salt is about 40% sodium. Extra sodium leaves the body in urine, so urine sodium rises with a salty diet. Cutting sodium helps lower blood pressure. The American Heart Association advises no more than 2,300 mg of sodium a day, about one teaspoon of salt, and ideally 1,500 mg for most adults. A single urine sample is a weak guide to daily intake. A 24-hour urine collection is more reliable.", "hist": ["Urine sodium 200 mmol/L in Dec 2025 (range 25–145)", "No blood pressure reading in the record", "Lp(a) 112.4 and a borderline stress test, which make blood pressure control more important"], "tests": ["Blood pressure in clinic and at home", "Blood sodium and potassium", "24-hour urine sodium if an accurate count is wanted", "Renin and aldosterone if morning cortisol stays low"], "preg": ["Less salt in household cooking makes it easier for Gaurav to keep his own intake down.", "This is a heart item more than a fertility item, but it fits the same before-pregnancy health check."]}, "sperm": {"what": "A semen analysis is the main test of male fertility. It counts sperm and checks how well they move and how they are shaped. US urology and fertility guidelines say a man's first fertility check should include a reproductive history and at least one semen analysis, and that both partners should be checked at the same time. Blood hormone tests show the signals for making sperm, but not the sperm themselves. Sperm take roughly 2 to 3 months to form, so a result reflects health over the past few months.", "hist": ["No semen analysis on record", "Normal in Dec 2025: testosterone 375, free testosterone 8.24, LH 5.71, FSH 3.24, prolactin 7.61 and estradiol 17.7", "Dec 2025: folate slightly low; zinc, B12 and vitamin D near the low edge; homocysteine near the top", "SHBG low at 29.9 in Dec 2025, which can go with insulin resistance", "Slightly widened airways on the Mar 2023 CT, which in rare inherited conditions link to sperm movement problems"], "tests": ["Semen analysis, usually after 2 to 7 days without ejaculation", "Results are compared with World Health Organization 2021 lower limits, such as 16 million sperm per mL and 30% moving forward", "A repeat semen analysis if the doctor wants to confirm an abnormal result", "More hormone tests and genetic tests, usually only if the semen analysis shows a problem"], "preg": ["This is the most direct way to know whether sperm count and movement are on track.", "Testosterone products should be avoided while trying to conceive, because they shut down sperm making.", "Antioxidant and vitamin supplements have not been proven to treat male infertility.", "A feverish illness can lower sperm for up to about 3 months, so the test is fairest after a well stretch.", "UW Health Fertility Care can check both partners, which may mean fewer separate visits."]}, "jet": {"what": "The body's daily clock takes days to adjust after a long flight. Cortisol follows that clock, so a morning test taken soon after crossing many time zones can read low even when the adrenal glands work normally. Short, broken sleep can do the same.", "hist": ["WHOOP: time zone changed from US Pacific time to India time (13½ hours) on Nov 30, 2025", "Blood drawn at 8:00 a.m. India time on Dec 5, 2025, 4–5 days after landing", "WHOOP: only 3 h 20 min of sleep on the night of Dec 3, 2025", "WHOOP: he usually sleeps about 6–7 hours, against an estimated need of 8–9"], "tests": ["Repeat 8:00 a.m. cortisol with ACTH in Madison, at least 2 weeks after any long flight", "Keep a normal sleep schedule for the week before the repeat test"], "preg": ["If the repeat is normal, no adrenal treatment is needed, and nothing changes the plan to conceive.", "If the repeat is still low, the adrenal and pituitary tests should be finished before pregnancy."]}};
const PLAIN = {"SHBG": {"w": ["SHBG stands for sex hormone-binding globulin. It is a protein made by the liver. It carries testosterone and other sex hormones through the blood, like a bus carrying passengers.", "A hormone riding on the bus is not free to work. When SHBG is low, more of the hormone is free. Low SHBG is closely linked to insulin resistance, where the body has to make extra insulin to keep blood sugar normal."], "y": ["Gaurav's SHBG was 29.9 nmol/L in Dec 2025.", "The lab range is 32.4–128, so his result was a little below it.", "His free testosterone was normal at 8.24 ng/dL (range 4.7–24.4).", "His fasting glucose (89) and HbA1c (5.1%) were normal, so these results do not show diabetes.", "Because low SHBG can go with insulin resistance, it is worth a recheck."]}, "Cortisol": {"w": ["Cortisol is a stress hormone. The adrenal glands, which sit on top of the kidneys, make it. It helps keep blood pressure and blood sugar steady and helps the body cope with illness.", "Cortisol follows a daily clock. It is highest in the early morning and much lower late at night. A morning test is like checking a pot of water at the time it should be boiling."], "y": ["Gaurav's cortisol was 3.70 µg/dL at 8:00 a.m. in Dec 2025.", "A usual morning level is about 6–18, so his was low for that time of day.", "WHOOP shows Gaurav flew from the US to India on Nov 30, 2025, a 13½-hour time change. The blood was drawn at 8:00 a.m. India time on Dec 5, only 4–5 days after landing, and his sleep that week was short and broken (3 h 20 min on the night of Dec 3). In a study of people flying east across more than five time zones, the cortisol daily clock stayed on home time, and morning cortisol was lower than normal. At 8:00 a.m. in India, his body clock may still have been closer to evening, when cortisol is naturally low.", "One low result does not prove a problem, because steroid medicines (including creams, inhalers and joint shots), a sleep schedule that runs late and differences between lab methods can all make a morning reading low.", "His DHEA-S, another adrenal hormone, was normal at 316 µg/dL (range 80–560). One medical review says a DHEA-S above 100 rules out the adrenal glands themselves failing, so this is reassuring. A repeat test is still needed, because a normal DHEA-S does not fully rule out a problem with the pituitary signal.", "A repeat morning test with ACTH, and if needed a stimulation test, can settle it."]}, "IGF-1": {"w": ["IGF-1 stands for insulin-like growth factor 1. The liver makes it when growth hormone from the pituitary gland tells it to. Doctors use IGF-1 as a stand-in for growth hormone, because growth hormone itself rises and falls through the day.", "IGF-1 changes a lot with age. It rises to a peak in the teenage years and then slowly falls through adult life. So the right range depends on age, like a shoe size that changes as a child grows."], "y": ["Gaurav's IGF-1 was 107 ng/mL in Dec 2025, when he was 30.", "The MedPlus Hyderabad lab printed a range of 220–972 and marked it low.", "That exact range matches a published range for 14-year-old boys, not for adults.", "Published ranges for men in their late 20s and early 30s start between about 88 and 117, depending on the lab method.", "So his result is low-normal or just below normal, and a repeat at a US lab with an adult age-based range would clear this up."]}, "Free T3": {"w": ["T3 is the active thyroid hormone. The thyroid gland in the neck makes mostly T4, and the body turns T4 into T3. Free T3 is the part not tied to proteins, ready to work.", "Thyroid hormone sets the body's speed, like the idle setting on a car engine. TSH (thyroid-stimulating hormone) is the signal from the pituitary gland that tells the thyroid how hard to work."], "y": ["Gaurav's free T3 was 2.58 pg/mL in Dec 2025.", "The lab range is 2.66–4.33, so it was just below the bottom.", "His TSH was normal at 2.93 µIU/mL.", "A slightly low T3 with a normal TSH often comes from eating less, a recent illness or physical stress, rather than thyroid disease.", "A repeat with free T4 can show whether it was a one-time dip."]}, "Folate (red cell)": {"w": ["Folate is vitamin B9. It comes from leafy greens, beans, lentils and fortified grains. The body needs it to copy DNA, so it matters for cells that divide fast, including sperm.", "Red cell folate measures the folate stored inside red blood cells. It reflects a longer stretch of time than a blood folate test, which can change after one meal."], "y": ["Gaurav's red cell folate was 500.9 ng/mL in Dec 2025.", "The MedPlus range is 523–1257, so it was a little below that lab's range.", "Folate ranges differ a lot between labs and test methods. One US hospital lists 140–628 ng/mL as normal, and his result sits inside that range.", "So this is a borderline result, not a clear shortage.", "A repeat at a US lab, with B12 checked at the same time, would show where he stands."]}, "Iron": {"w": ["Serum iron is the iron in the blood at the moment of the test. Iron helps red blood cells carry oxygen.", "Serum iron goes up and down through the day and after meals, like the water level in a tub with the tap and the drain both open. Ferritin, the iron storage protein, is a better guide to how much iron the body has saved."], "y": ["Gaurav's serum iron was 58 µg/dL in Dec 2025, below the 70–180 range.", "His ferritin, the storage measure, was normal at 97.8 ng/mL (range 30–400).", "His transferrin saturation, which shows how full the iron carrier is, was normal at 19.3% (range 15–50).", "His hemoglobin was normal at 14.2 g/dL.", "Together this points to a low reading on that day, not empty iron stores."]}, "Magnesium": {"w": ["Magnesium is a mineral. It helps muscles relax, nerves send signals and the heart keep a steady beat.", "Most of the body's magnesium sits inside bones and cells, not in the blood. So a blood test is like looking at the cash in a wallet, not the savings account. A blood level can even look normal when the stores are low."], "y": ["Gaurav's magnesium was 1.7 mg/dL in Dec 2025.", "The range is 1.8–2.6, so it was just below normal.", "Common reasons include low intake, loose stools, alcohol, and some medicines such as long-term acid reducers or water pills.", "Low magnesium often comes with low potassium or low calcium, so those are worth checking at the same time."]}, "Hematocrit": {"w": ["Hematocrit is the share of the blood made up of red blood cells. It is shown as a percent.", "Picture a glass of blood left to settle. The red cells sink to the bottom. Hematocrit is how much of the glass the red layer fills."], "y": ["Gaurav's hematocrit was 44.7% in Mar 2023 and 38.9% in Dec 2025.", "The range is 40–50, so the 2025 result was a little low.", "His hemoglobin, the oxygen carrier, was normal both times (15.6 g/dL, then 14.2 g/dL).", "The high MCHC on the same test is worked out from hematocrit, so a hematocrit reading that is off would push MCHC up.", "A repeat blood count at a US lab would show whether the low hematocrit is real."]}, "MCHC": {"w": ["MCHC stands for mean corpuscular hemoglobin concentration. It tells how packed each red blood cell is with hemoglobin, the protein that carries oxygen.", "The machine does not measure MCHC directly. It works it out by dividing hemoglobin by hematocrit. So if one of those numbers is off, MCHC comes out wrong, like a math answer thrown off by one bad number."], "y": ["Gaurav's MCHC was 34.9 g/dL in Mar 2023 and 36.5 g/dL in Dec 2025.", "The range is 31.5–34.5, so both were high.", "A high MCHC is often a lab effect, such as red cells clumping in a cold sample or cloudy blood interfering with the reading.", "In one study of MCHC results above 36.5, about 3 in 10 were lab effects and about 1 in 7 came from a true red cell condition.", "A repeat blood count with a blood smear can tell these apart."]}, "Lymphocytes": {"w": ["Lymphocytes are a type of white blood cell. They fight viruses and make antibodies, and they remember germs the body has met before.", "A blood count can report lymphocytes two ways. One is a percent of all white cells. The other is the actual number of cells. The percent can rise just because another white cell type has fallen, like one slice of a pie looking bigger when the other slices shrink."], "y": ["Gaurav's lymphocytes were 44.8% in Mar 2023 and 47.4% in Dec 2025.", "The range is 20–40%, so both were high.", "His record does not list the actual lymphocyte count, which is the number doctors use to decide if there is a true excess.", "Common causes of a true excess are viral infections and physical stress.", "A repeat blood count with the actual number and a blood smear is the next step."]}, "APTT (clotting time)": {"w": ["APTT stands for activated partial thromboplastin time. It measures how many seconds a blood sample takes to clot in the lab.", "Clotting works like a row of dominoes, with each clotting protein knocking over the next. APTT checks one part of that row. A longer time can mean one domino is weak, or that something in the sample slowed the test down."], "y": ["Gaurav's APTT was 34.9 seconds in Mar 2023.", "The range is 25–34, so it was less than one second over.", "It was tested only once and was not repeated in Dec 2025.", "Small rises can come from how the sample was collected or handled.", "A repeat test, and a mixing test if it is still long, would settle it."]}, "LDL cholesterol": {"w": ["LDL stands for low-density lipoprotein. It is called the 'bad' cholesterol because it can build up in the walls of arteries.", "Think of LDL particles as delivery trucks. The more trucks on the road, the more of them bump into the artery walls and leave debris behind. Over many years, that debris can narrow the arteries."], "y": ["Gaurav's LDL was 117 mg/dL in Dec 2025.", "The goal on his report is under 100, so it was above goal.", "His total cholesterol (181), HDL (51) and triglycerides (66) were in range.", "His high Lp(a) makes LDL more important, because guidelines say people with high Lp(a) should keep their other risks lower.", "A fasting lipid panel at a US lab will confirm the number."]}, "Lipoprotein(a)": {"w": ["Lp(a), said 'L-P-little-a', stands for lipoprotein(a). It is a cholesterol particle, much like LDL, with an extra sticky protein attached.", "Lp(a) is set mostly by genes. More than 90% of the level comes from inheritance, so it stays about the same for life. Diet and exercise barely change it, so one test is usually enough."], "y": ["Gaurav's Lp(a) was 112.4 mg/dL in Dec 2025.", "His lab's limit is under 30.", "The National Lipid Association calls 50 or higher a high-risk level, and his result is more than twice that.", "European experts estimate that heart and artery risk roughly doubles at around 100.", "High Lp(a) is a lifelong risk factor, not proof of heart disease on its own. The borderline treadmill test is the part that needs a doctor's follow-up now."]}, "hsCRP": {"w": ["hsCRP stands for high-sensitivity C-reactive protein. The liver makes CRP when there is inflammation anywhere in the body.", "The high-sensitivity test picks up very small amounts, like a smoke detector set to notice a faint whiff. Low-level inflammation in artery walls is linked to heart risk. But a cold, an infection or an injury can also raise it."], "y": ["Gaurav's hsCRP was 1.46 mg/L in Dec 2025.", "Heart groups sort results into under 1 (lower risk), 1 to 3 (average risk) and over 3 (higher risk), so his falls in the average group.", "His Mar 2023 result of 0.60 was a regular CRP test, so the two numbers cannot be compared directly.", "Guidance says to measure it twice, about two weeks apart, at a time when he is well."]}, "Total protein": {"w": ["Total protein adds up all the proteins in the liquid part of the blood. The two main groups are albumin and globulins.", "Albumin keeps fluid inside blood vessels and carries hormones and minerals. Globulins include the antibodies that fight infection. Total protein is like counting all the vehicles on a road without knowing which are cars and which are buses."], "y": ["Gaurav's total protein was 6.4 g/dL in Dec 2025.", "The MedPlus range is 6.6–8.3, so it was a little low.", "Some US ranges start at 6.3, and by that range his result would count as normal.", "His report does not show albumin and globulin separately, which would show which part is low.", "Low blood protein can make zinc and total cortisol read lower, because both travel on blood proteins."]}, "Urine sodium": {"w": ["Urine sodium measures how much sodium, the main part of salt, is in a urine sample. The kidneys get rid of extra sodium through urine.", "A single urine sample is a snapshot. It changes with recent meals and with how much a person drank. A 24-hour urine collection is a better guide to daily salt intake, like a full day of video instead of one photo."], "y": ["Gaurav's urine sodium was 200 mmol/L in Dec 2025.", "The lab range is 25–145, so it was high.", "The most common reason is a salty diet, but water pills, kidney salt loss and low adrenal function can also raise it.", "Because his morning cortisol was also low, a doctor may want to check blood sodium and potassium too.", "A blood pressure check is a simple first step."]}, "Testosterone, total": {"w": ["Testosterone is the main male hormone. The testes make it when the pituitary gland sends a signal called LH (luteinizing hormone). It supports muscle, energy, sex drive and sperm making.", "Total testosterone counts all of it, both the part riding on proteins and the free part. Levels are highest in the morning, so the test is best done between about 7 and 11 a.m."], "y": ["Gaurav's total testosterone was 375 ng/dL in Dec 2025.", "The lab range is 197–670, so it was normal.", "US urology guidance uses under 300 as a sign of low testosterone, and his result is above that.", "His free testosterone (8.24), LH (5.71) and FSH (3.24) were also normal.", "This means the hormone signals for making sperm look normal, but only a semen analysis can show the sperm themselves."]}, "Vitamin D": {"w": ["Vitamin D helps the body take in calcium for strong bones. Skin makes it in sunlight, and small amounts come from foods such as fish, eggs and fortified milk.", "The blood test measures 25-hydroxyvitamin D, the storage form. Expert groups do not agree on one cut-off for 'enough', so lab ranges vary."], "y": ["Gaurav's vitamin D was 32.1 ng/mL in Dec 2025.", "His lab range is 31–100, so it was normal but near the bottom.", "The Endocrine Society's 2024 guideline says experts could not set a clear target level, and it does not advise routine testing for healthy adults under 75.", "A trial of 330 men with fertility problems found that vitamin D did not improve semen quality overall."]}, "Vitamin B12": {"w": ["Vitamin B12 helps make red blood cells, keeps nerves healthy and helps copy DNA. It comes mainly from meat, fish, eggs and dairy, and from fortified foods.", "Folate and B12 work as a team. Doctors check both together, and they treat a B12 shortage before giving folic acid."], "y": ["Gaurav's B12 was 243 pg/mL in Dec 2025.", "His lab range is 197–771, so it was normal but in the lower part.", "A level under 150 clearly shows a shortage.", "When the level is low-normal, a test called methylmalonic acid (MMA) can show whether the body is truly short.", "Eating little or no animal food, or taking long-term acid reducers or metformin, raises the chance of low B12."]}, "Zinc": {"w": ["Zinc is a mineral. It helps the immune system, wound healing and sperm making.", "Blood zinc changes through the day. It is lowest in the evening, can drop after meals and falls during illness. So it is best measured early in the morning before eating, like weighing oneself at the same time each day."], "y": ["Gaurav's zinc was 72.63 µg/dL in Dec 2025.", "His lab range is 70–120, so it was normal but near the bottom.", "About 60% of blood zinc rides on albumin, so his slightly low total protein could pull the reading down.", "A large trial found that zinc plus folic acid pills did not improve semen quality or birth rates."]}, "Homocysteine": {"w": ["Homocysteine is a substance the body makes when it breaks down protein. The body clears it using folate, B12 and B6.", "When those vitamins run low, homocysteine builds up, like dishes piling up in a sink when the dishwasher is slow. High levels are linked to heart disease and to damage in sperm DNA."], "y": ["Gaurav's homocysteine was 11.9 µmol/L in Dec 2025.", "His lab range is 3.7–13.9, so it was normal but in the upper part.", "Many labs call levels under about 15 normal.", "His folate was slightly low and his B12 low-normal, and both can push homocysteine up.", "Rechecking it with folate and B12 shows whether the three move together."]}};

function regroup(){
  const ix = {}; GROUPS.forEach(([g,ns],gi)=>ns.forEach((n,ni)=>ix[n]=[g,gi*100+ni]));
  S.tests.forEach((t,k)=>{ if(ix[t.name]) t.group = ix[t.name][0]; t.__o = ix[t.name] ? ix[t.name][1] : 9000+k; });
  S.tests.sort((a,b)=>a.__o-b.__o); S.tests.forEach(t=>delete t.__o);
}
const numv = v => { const n = parseFloat(String(v).replace(/[,<]/g,'')); return isNaN(n) ? null : n; };
const worst = t => { const fs = t.values.map(v=>v.f); return fs.includes('h')?'h':fs.includes('l')?'l':fs.includes('x')?'x':'n'; };
function parseRange(r){
  r = String(r||'').replace(/,/g,''); if(/read on|negative/i.test(r)) return {lo:null,hi:null};
  let m = r.match(/(\d+(?:\.\d+)?)\s*or more/i); if(m) return {lo:+m[1], hi:null};
  m = r.match(/under\s*(\d+(?:\.\d+)?)/i); if(m) return {lo:null, hi:+m[1]};
  m = r.match(/(\d+(?:\.\d+)?)\s*[–-]\s*(\d+(?:\.\d+)?)/); if(m) return {lo:(+m[1])||null, hi:+m[2]};
  return {lo:null, hi:null};
}
function scale(t){
  const rg = parseRange(t.range), vals = t.values.map(v=>numv(v.v)).filter(x=>x!==null);
  if(!vals.length || (rg.lo===null && rg.hi===null)) return null;
  let mn, mx;
  if(rg.lo!==null && rg.hi!==null){ const s = rg.hi-rg.lo; mn = Math.max(0, rg.lo-s*0.6); mx = rg.hi+s*0.6; }
  else if(rg.hi!==null){ mn = Math.max(0, Math.min(rg.hi*0.7, ...vals) - rg.hi*0.05); mx = rg.hi*1.3; } else { mn = 0; mx = rg.lo*2.4; }
  mn = Math.min(mn, ...vals); mx = Math.max(mx, ...vals);
  const p = x => Math.max(1.5, Math.min(98.5, (x-mn)/(mx-mn)*100));
  return {rg, p, a: rg.lo!==null ? p(rg.lo) : 0, b: rg.hi!==null ? p(rg.hi) : 100};
}
function spec(t, big, tm){
  const s = scale(t);
  if(!s) return `<div class="spec"><span class="none"></span></div><div class="speclab"><span>No number range to plot</span></div>`;
  const z = s.rg.lo!==null ? `<span class="zl" style="width:${s.a}%"></span><span class="zn" style="width:${s.b-s.a}%"></span><span class="zh" style="width:${100-s.b}%"></span>` : `<span class="zn" style="width:${s.b}%;border-radius:5px 0 0 5px"></span><span class="zh" style="width:${100-s.b}%"></span>`;
  const vs = t.values.map(v=>({v, n:numv(v.v)})).filter(o=>o.n!==null);

function renderAll(){ regroup(); header(); gGlance(); questions(); results(); gHist(); history(); care(); map2(); drawNet(); defaultCond(); gWhoop(); gSupps(); show(); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.qf){ qFilter=t.dataset.qf; questions(); return; }
  if(t.dataset.qd){ qDoc=t.dataset.qd; questions(); return; }
  if(t.id==="flagtoggle"){ onlyFlag=!onlyFlag; results(); return; }
  if(t.dataset.net){
    const [kind,i,net] = t.dataset.net.split(":");
    const p = S[kind][+i]; p.network = net; p.checked = net==="Not checked" ? "" : today() + " (by you)";
    care(); save(); return;
  }
  if(t.dataset.s){
    const q = S.questions.find(x=>x.id===t.closest(".q").dataset.id);
    q.status = t.dataset.s;
    if(q.status!=="open" && !q.date) q.date = today();
    if(q.status==="open") q.date = "";
    header(); questions(); save();
  }
});
document.addEventListener("change", (e) => {
  const id = e.target.dataset && e.target.dataset.ans; if(!id) return;
  const q = S.questions.find(x=>x.id===id); q.answer = e.target.value;
  if(q.answer && q.status==="open"){ q.status="answered"; q.date = q.date || today(); header(); questions(); }
  save();
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target.id;
  if(f==="addq"){
    S.questions.push({id:"q"+Date.now(), doctor:$("nq-doc").value.trim(), q:$("nq-q").value.trim(), why:$("nq-why").value.trim(), status:"open", answer:"", date:""});
    questions(); header();
  } else if(f==="addr"){
    const name=$("nr-test").value.trim(), d=$("nr-date").value.trim();
    let t = S.tests.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!t){ t={name, unit:"", explain:"Added by you.", range:$("nr-range").value.trim(), group:"Added results", values:[]}; S.tests.push(t); }
    if(!S.dates.includes(d)) S.dates.push(d);
    t.values = t.values.filter(v=>v.d!==d); t.values.push({d, v:$("nr-val").value.trim(), f:$("nr-flag").value});
    t.values.sort((a,b)=>S.dates.indexOf(a.d)-S.dates.indexOf(b.d));
    results(); header();
  } else if(f==="addc"){
    const net=$("nc-net").value;
    S[$("nc-kind").value].push({name:$("nc-name").value.trim(), role:$("nc-role").value.trim(), place:$("nc-place").value.trim(), phone:$("nc-phone").value.trim(), network:net, checked: net==="Not checked"?"":today()+" (by you)"});
    care();
  } else if(f==="addh"){
    S.history.push({d:$("nh-d").value.trim(), t:$("nh-t").value.trim(), x:$("nh-x").value.trim()});
    history();
  } else return;
  save();
});
